<!DOCTYPE html>
<html lang="en-GB">
<head>
<style id="fg-guard">html{visibility:hidden}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/auth-guard.js"></script>
<script src="/lead.js"></script>
<script src="/results.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event quote estimator | Fort Green</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfbfb; --surface:#ffffff; --surface-2:#eeeeee; --ink:#000000; --muted:#5f5f5f;
  --line:#cecece; --accent:#000000; --accent-ink:#ffffff; --accent-soft:#e8e8e8;
  --amber:#4a4a4a; --amber-soft:#e3e3e3; --red:#b42318; --red-soft:#fbe4e1; --zone-out:#ffffff; --zone-std:#cecece;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#100f10; --surface:#1a191a; --surface-2:#262526; --ink:#ffffff; --muted:#a9a9a9;
    --line:#3b3a3b; --accent:#ffffff; --accent-ink:#000000; --accent-soft:#2e2d2e;
    --amber:#cecece; --amber-soft:#333233; --red:#ff7b6e; --red-soft:#2d1513; --zone-out:#1a191a; --zone-std:#4a494a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#100f10; --surface:#1a191a; --surface-2:#262526; --ink:#ffffff; --muted:#a9a9a9;
  --line:#3b3a3b; --accent:#ffffff; --accent-ink:#000000; --accent-soft:#2e2d2e;
  --amber:#cecece; --amber-soft:#333233; --red:#ff7b6e; --red-soft:#2d1513; --zone-out:#1a191a; --zone-std:#4a494a;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top, 0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.topbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 18px}
.brand{display:flex;align-items:center;font-family:"Antonio","Arial Narrow",sans-serif;font-weight:700;font-size:26px;line-height:1;letter-spacing:.01em;text-transform:uppercase;color:var(--ink);text-decoration:none}
.tool-name{font-size:14px;color:var(--muted);font-weight:500}

main{max-width:560px;margin:0 auto;padding:20px 18px 120px}
.screen{display:none}
.screen.on{display:block}

h1{font-family:"Antonio","Arial Narrow",sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(46px,13vw,72px);line-height:.9;letter-spacing:-.01em;margin:8px 0 16px}
h2{font-family:"Antonio","Arial Narrow",sans-serif;font-weight:600;text-transform:uppercase;font-size:28px;line-height:1.1;margin:0 0 6px}
h3{font-family:"Antonio","Arial Narrow",sans-serif;font-weight:600;font-size:22px;line-height:1.15;margin:0 0 4px}
p{margin:0 0 12px}
.lede{font-size:18px;color:var(--muted);max-width:34em}
.muted{color:var(--muted)}
.small{font-size:14px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:0;padding:18px;margin:16px 0}
.status{display:flex;gap:10px;align-items:flex-start;border-left:4px solid var(--accent);padding:10px 14px;background:var(--surface);border-radius:0;margin:18px 0}
.status strong{display:block}
.status.warn{border-left-color:var(--red)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:0;border:0;cursor:pointer;font-family:"Manrope",system-ui,sans-serif;font-weight:600;font-size:16px;letter-spacing:.01em;text-decoration:none}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:grid;gap:10px;margin-top:18px}
.link-btn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Forms */
.field{margin:0 0 18px}
.field label,.field .label{display:block;font-weight:600;margin-bottom:6px}
.hint{font-size:14px;color:var(--muted);margin-top:6px}
input[type=text],input[type=email],input[type=number],input[type=search],select{width:100%;min-height:50px;padding:10px 14px;border-radius:0;border:1.5px solid var(--line);background:var(--surface);font-size:17px}
input:focus,select:focus{border-color:var(--accent);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);padding:4px;border-radius:0}
.seg button{min-height:44px;border:0;border-radius:0;background:transparent;cursor:pointer;font-weight:600;font-size:15px;color:var(--muted);padding:4px 6px;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.check{display:flex;gap:12px;align-items:flex-start;margin:12px 0;font-size:15px}
.check input{width:22px;height:22px;margin-top:1px;accent-color:var(--accent);flex:none}

/* Load meter: signature element */
.meter{margin:40px 0 8px}
.meter-track{position:relative;height:46px;background:var(--zone-out);box-shadow:inset 0 0 0 1px var(--line)}
.meter-track .run{position:absolute;left:0;top:0;bottom:0;background:var(--accent);transition:width .4s ease}
.meter-track .peak{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--zone-std) 0 6px,transparent 6px 11px);box-shadow:inset 0 0 0 1px var(--zone-std);transition:left .4s ease,width .4s ease}
.meter-track .limit{position:absolute;top:-10px;bottom:-10px;width:0}
.meter-track .limit::before{content:"";position:absolute;left:-1.5px;top:0;bottom:0;width:3px;background:var(--red)}
.meter-track .limit::after{content:attr(data-label);position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-size:12px;font-weight:600;padding:1px 7px;white-space:nowrap}
.meter-track .over{position:absolute;inset:0;background:var(--red-soft);box-shadow:inset 0 0 0 2px var(--red)}
.meter-ticks{position:relative;height:22px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter-ticks span{position:absolute;top:4px;transform:translateX(-50%);white-space:nowrap}
.meter-ticks span:first-child{transform:none}
.meter-ticks span:last-child{transform:translateX(-100%)}
.legend{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:7px}
.sw{width:14px;height:14px;flex:none;display:inline-block}
.sw-run{background:var(--accent)}
.sw-peak{background:repeating-linear-gradient(135deg,var(--zone-std) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1px var(--zone-std)}
.sw-lim{background:var(--red);width:4px}

/* Verdict */
.verdict{border-radius:0;padding:18px;margin:18px 0;border:1.5px solid var(--line);background:var(--surface)}
.verdict.v-main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.verdict.v-main .muted{color:inherit;opacity:.8}
.verdict.v-alt{border-color:var(--accent)}
.verdict.v-check{border-color:var(--ink);border-style:dashed}
.big{font-family:"Antonio","Arial Narrow",sans-serif;font-weight:700;font-size:56px;line-height:.95;text-transform:uppercase;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:16px 0}
.stats div{background:var(--surface);padding:12px}
.stats b{display:block;font-family:"Antonio","Arial Narrow",sans-serif;font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}

/* Equipment */
.sum{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 53px);z-index:5;background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--line)}
.sum-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.sum-row strong{font-size:16px}
.bar{height:6px;background:var(--surface-2);border-radius:0;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s ease}
.q-group{font-family:"Antonio","Arial Narrow",sans-serif;font-weight:600;text-transform:uppercase;font-size:24px;margin:24px 0 2px;padding-top:6px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item strong{display:block;font-weight:600;line-height:1.3}
.item .muted{font-size:13px}
.item.has{}
.item.has strong::before{content:"";display:inline-block;width:8px;height:8px;background:var(--accent);margin-right:8px;vertical-align:2px}
.stepper{display:grid;grid-template-columns:44px 40px 44px;border:1.5px solid var(--line);background:var(--surface)}
.stepper button{height:42px;border:0;background:none;cursor:pointer;font-size:22px;font-weight:600;line-height:1}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper output{display:flex;align-items:center;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums}
.rm{font-size:13px}

/* Tables */
.tbl-wrap{overflow-x:auto;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.phase{display:grid;grid-template-columns:34px 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.phase .bar{margin:0;height:14px}
.phase b{font-family:"Antonio","Arial Narrow",sans-serif;font-size:18px}
.ticks{list-style:none;padding:0;margin:0}
.ticks li{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.ticks li:last-child{border-bottom:0}
.ticks li::before{content:"";width:16px;height:16px;border:1.5px solid var(--ink);margin-top:3px}
.ticks strong{display:block}
.ticks span{color:var(--muted);font-size:14px}

.locked{border:1.5px dashed var(--line);border-radius:0;padding:20px;margin:18px 0;text-align:left}
.cta{background:var(--accent);color:var(--accent-ink);padding:20px;margin:18px 0}
.cta .muted{color:inherit;opacity:.8}
.cta .btn-primary{background:var(--accent-ink);color:var(--accent)}
.cta .btn-ghost{border-color:currentColor;color:inherit}
.disclaimer{font-size:13px;color:var(--muted);margin-top:24px;border-top:1px solid var(--line);padding-top:14px}
.empty{padding:40px 0;text-align:left}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom, 0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;background:none;border:0;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--accent);border-radius:0}
.badge{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;line-height:18px;text-align:center}

/* Bottom sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--surface);border-radius:0;padding:10px 20px calc(20px + env(safe-area-inset-bottom, 0px));max-height:90vh;overflow-y:auto;transform:translateY(105%);transition:transform .28s ease}
.sheet.on{transform:none}
.grabber{width:42px;height:5px;border-radius:0;background:var(--line);margin:4px auto 14px}
.error{color:var(--red);font-size:14px;margin-top:6px}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}

@media print{
  .topbar,.nav,.no-print,.overlay,.sheet{display:none!important}
  :root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#444;--line:#ccc;--accent:#000;--accent-ink:#fff}
  body{background:#fff}
  main{padding:0;max-width:none}
  .screen{display:none!important}
  #screen-power{display:block!important}
  .panel,.verdict,.stats,.meter,table{break-inside:avoid}
  .verdict.v-main,.cta{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* Quote estimator */
input[type=tel]{width:100%;min-height:50px;padding:10px 14px;border-radius:0;border:1.5px solid var(--line);background:var(--surface);font-size:17px;color:var(--ink)}
.seg{grid-auto-flow:row;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.svc{border:1.5px solid var(--line);background:var(--surface);margin:14px 0}
.svc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;cursor:pointer}
.svc-head h3{margin:0}
.svc-head span{font-size:14px;color:var(--muted)}
.svc.on{border-color:var(--accent)}
.svc-body{padding:0 16px 14px;border-top:1px solid var(--line)}
.toggle{width:52px;height:30px;border-radius:15px;border:0;background:var(--surface-2);position:relative;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .2s}
.toggle[aria-pressed="true"]{background:var(--accent)}
.toggle[aria-pressed="true"]::after{left:25px}
.lines{list-style:none;padding:0;margin:0}
.lines li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.lines li b{font-variant-numeric:tabular-nums}
.lines li.total{border-bottom:0;font-weight:700}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="https://www.fortgreen.co.uk" target="_blank" rel="noopener">Fort Green</a>
    <div class="tool-name">Quote estimator</div>
  </div>
</header>

<main id="main">
  <section class="screen" id="screen-start" aria-labelledby="h-start"></section>
  <section class="screen" id="screen-event" aria-labelledby="h-event"></section>
  <section class="screen" id="screen-services" aria-labelledby="h-services"></section>
  <section class="screen" id="screen-estimate" aria-labelledby="h-estimate"></section>
</main>

<nav class="nav" aria-label="Sections">
  <div class="nav-in">
    <button data-tab="start"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button data-tab="event"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Event</button>
    <button data-tab="services"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Services</button>
    <button data-tab="estimate"><svg viewBox="0 0 24 24"><path d="M15 5.5a5 5 0 0 0-8 4V18h9M5 13h7M5 18h12"/></svg>Estimate</button>
  </div>
</nav>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="h-sheet">
  <div class="grabber"></div>
  <h2 id="h-sheet">Request a firm quote</h2>
  <p class="muted">We’ll check the details, ask anything we need and send a confirmed price.</p>
  <form id="lead-form" novalidate>
    <div class="field"><label for="f-name">Your name</label><input type="text" id="f-name" autocomplete="name"></div>
    <div class="field"><label for="f-email">Email</label><input type="email" id="f-email" autocomplete="email" inputmode="email"><div class="error" id="f-email-err" hidden></div></div>
    <div class="field"><label for="f-phone">Phone</label><input type="tel" id="f-phone" autocomplete="tel" inputmode="tel"></div>
    <div class="field"><label for="f-org">Organisation</label><input type="text" id="f-org" autocomplete="organization"></div>
    <div class="field"><label for="f-notes">Anything else we should know?</label><textarea id="f-notes" rows="3" style="width:100%;padding:10px 14px;border:1.5px solid var(--line);background:var(--surface);font:inherit;font-size:16px;color:var(--ink)"></textarea></div>
    <label class="check"><input type="checkbox" id="f-mkt"><span>Send me event planning updates and occasional news from Fort Green. You can unsubscribe at any time.</span></label>
    <div class="btn-row">
      <button type="submit" class="btn btn-primary btn-block" id="f-send">Send my request</button>
      <button type="button" class="btn btn-ghost btn-block" id="sheet-close">Cancel</button>
    </div>
  </form>
</div>

<script>
const QUOTE_ENDPOINT = "https://sierra-six.app.n8n.cloud/webhook/quote-request";
const CONTACT_EMAIL = "info@fortgreen.co.uk";
const WHATSAPP = "https://wa.me/447399232855";
const STORE_KEY = "fg-quote-v1";

const TYPES = [["corporate","Corporate or private"],["venue","Venue night"],["concert","Concert or gig"],["festival","Festival"],["community","Community event"],["other","Something else"]];
const SECURITY = [["sec_door","SIA door supervisors"],["sec_steward","Stewards"],["sec_supervisor","Supervisors"],["sec_response","Response team"],["sec_head","Head of security"]];
const CREW = [["crew_general","General crew"],["crew_stage","Stage manager"],["crew_sound","Sound engineer"],["crew_lighting","Lighting technician"],["crew_pm","Production manager"]];
const EQUIP = [["eq_radio","Two-way radios"],["eq_barrier","Crowd barrier (metres)"],["eq_fence","Site fencing (panels)"],["eq_cctv","CCTV towers"],["eq_light","Lighting towers"],["eq_detector","Walk-through metal detectors"]];
const GENS = ["10","20","30","45","60","100","150","200","350","500"];

const BLANK = () => ({agreed:false, name:"", type:"corporate", date:"", postcode:"", people:"", hours:"6", days:"1",
  security:{on:false}, power:{on:false, gen:"30", qty:1, power_dist:true, power_elec:true, litres:""}, crew:{on:false}, equipment:{on:false},
  requested:false});
let state = BLANK();
try{ const s = JSON.parse(localStorage.getItem(STORE_KEY)||"null"); if(s) state = Object.assign(state, s); }catch(e){}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const int = v => { const x = parseInt(v, 10); return isFinite(x) && x > 0 ? x : 0; };
const money = n => "£" + Math.round(n).toLocaleString("en-GB");
const cfg = window.FG_CONFIG || {};
const sb = window.supabase && cfg.SUPABASE_URL ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;
let estimate = null, estimating = null;

function anyService(){ return ["security","power","crew","equipment"].some(k => state[k].on); }
function summaryLines(){
  const out = [];
  if(state.security.on) SECURITY.forEach(([k,l]) => { if(int(state.security[k])) out.push(int(state.security[k]) + " × " + l); });
  if(state.power.on) out.push((int(state.power.qty) || 1) + " × " + state.power.gen + " kVA generator" + (state.power.power_dist ? ", distribution" : "") + (state.power.power_elec ? ", electrician" : "") + (int(state.power.litres) ? ", " + int(state.power.litres) + " L fuel" : ""));
  if(state.crew.on) CREW.forEach(([k,l]) => { if(int(state.crew[k])) out.push(int(state.crew[k]) + " × " + l); });
  if(state.equipment.on) EQUIP.forEach(([k,l]) => { if(int(state.equipment[k])) out.push(int(state.equipment[k]) + " × " + l); });
  return out;
}

/* ---------- Screens ---------- */
function renderStart(){
  const started = state.name || anyService();
  $("#screen-start").innerHTML = `
    <h1 id="h-start">What will your event cost?</h1>
    <p class="lede">Choose the security, power, crew and equipment you need and get an estimate straight away. Then ask us for a firm quote in one tap.</p>
    <div class="panel">
      <h3>Before you start</h3>
      <p class="muted small">This is an estimate to help you budget, not a quote or an offer. Prices exclude VAT, and the final price depends on the date, location, access and details we confirm with you.</p>
      <label class="check" style="margin-bottom:0"><input type="checkbox" id="agree" ${state.agreed ? "checked" : ""}><span>I understand this is an estimate, not a quote.</span></label>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary btn-block" id="go-start" ${state.agreed ? "" : "disabled"}>${started ? "Continue" : "Start"}</button>
      ${started ? `<button class="btn btn-ghost btn-block" id="reset">Start a new estimate</button>` : ""}
    </div>
    <div class="panel">
      <h3>Not sure how many you need?</h3>
      <p class="muted small" style="margin:0">Work it out first with our <a href="/staffing/" style="color:var(--ink);font-weight:600">Staffing Calculator</a> and <a href="/power-planner/" style="color:var(--ink);font-weight:600">Power Planner</a>, then come back here.</p>
    </div>`;
  $("#agree").onchange = e => { state.agreed = e.target.checked; save(); $("#go-start").disabled = !state.agreed; };
  $("#go-start").onclick = () => go("event");
  const r = $("#reset");
  if(r) r.onclick = () => { if(window.FGResults) FGResults.startNew(); state = Object.assign(BLANK(), {agreed:state.agreed}); estimate = null; save(); go("event"); };
}

function renderEvent(){
  $("#screen-event").innerHTML = `
    <h1 id="h-event">Your event</h1>
    <div class="field"><label for="e-name">Event name</label><input type="text" id="e-name" value="${esc(state.name)}" placeholder="e.g. Summer Yard Party"></div>
    <div class="field"><span class="label">Type of event</span><div class="seg" role="group" aria-label="Type">${TYPES.map(([v,l]) => `<button type="button" data-type="${v}" aria-pressed="${state.type === v}">${l}</button>`).join("")}</div></div>
    <div class="two">
      <div class="field"><label for="e-date">Date</label><input type="date" id="e-date" value="${esc(state.date)}" style="width:100%;min-height:50px;padding:10px 14px;border:1.5px solid var(--line);background:var(--surface);font-size:17px"></div>
      <div class="field"><label for="e-pc">Postcode</label><input type="text" id="e-pc" value="${esc(state.postcode)}" autocomplete="postal-code"></div>
    </div>
    <div class="field"><label for="e-people">People expected</label><input type="number" id="e-people" inputmode="numeric" min="1" value="${esc(state.people)}" placeholder="e.g. 400"></div>
    <div class="two">
      <div class="field"><label for="e-hours">Hours a day</label><input type="number" id="e-hours" inputmode="decimal" min="1" max="24" step="0.5" value="${esc(state.hours)}"><div class="hint">Including set-up and close.</div></div>
      <div class="field"><label for="e-days">Days</label><input type="number" id="e-days" inputmode="numeric" min="1" max="30" value="${esc(state.days)}"></div>
    </div>
    <div class="btn-row"><button class="btn btn-primary btn-block" data-go="services">Next: choose services</button></div>`;
  const el = $("#screen-event");
  el.querySelectorAll("[data-type]").forEach(b => b.onclick = () => { state.type = b.dataset.type; save(); keep(renderEvent); });
  const bind = (id, k) => { $(id).oninput = e => { state[k] = e.target.value; estimate = null; save(); }; };
  bind("#e-name","name"); bind("#e-date","date"); bind("#e-pc","postcode"); bind("#e-people","people"); bind("#e-hours","hours"); bind("#e-days","days");
  bindGo(el);
}

function numField(group, key, label, max){
  const v = state[group][key] || "";
  return `<div class="field" style="margin-bottom:10px"><label for="${group}-${key}">${label}</label><input type="number" id="${group}-${key}" data-g="${group}" data-k="${key}" inputmode="numeric" min="0" max="${max || 999}" value="${esc(v)}" placeholder="0"></div>`;
}
function svcBlock(key, title, sub, body){
  const on = state[key].on;
  return `<div class="svc ${on ? "on" : ""}"><div class="svc-head" data-svc="${key}"><div><h3>${title}</h3><span>${sub}</span></div><button type="button" class="toggle" aria-pressed="${on}" aria-label="Include ${title}"></button></div>${on ? `<div class="svc-body">${body}</div>` : ""}</div>`;
}
function renderServices(){
  const p = state.power;
  $("#screen-services").innerHTML = `
    <h1 id="h-services">Services</h1>
    <p class="muted">Switch on what you need and add numbers. For staff, give how many are on duty at once.</p>
    ${svcBlock("security", "Security staff", "Door supervisors, stewards, supervisors", `<p class="small muted" style="margin:12px 0">Not sure? <a href="/staffing/" style="color:var(--ink);font-weight:600">Use the Staffing Calculator</a>.</p>` + SECURITY.map(([k,l]) => numField("security", k, l, 2000)).join(""))}
    ${svcBlock("power", "Event power", "Generator, distribution, electrician, fuel", `
      <div class="two" style="margin-top:12px">
        <div class="field"><label for="p-gen">Generator size</label><select id="p-gen">${GENS.map(g => `<option value="${g}" ${p.gen === g ? "selected" : ""}>${g} kVA</option>`).join("")}</select></div>
        <div class="field"><label for="p-qty">How many</label><input type="number" id="p-qty" inputmode="numeric" min="1" max="20" value="${esc(p.qty)}"></div>
      </div>
      <label class="check"><input type="checkbox" id="p-dist" ${p.power_dist ? "checked" : ""}><span>Distribution and cabling</span></label>
      <label class="check"><input type="checkbox" id="p-elec" ${p.power_elec ? "checked" : ""}><span>Event electrician on site</span></label>
      <div class="field"><label for="p-litres">Fuel (litres)</label><input type="number" id="p-litres" inputmode="numeric" min="0" value="${esc(p.litres)}" placeholder="0"><div class="hint">Work it out on the <a href="/power-planner/#fuel" style="color:var(--ink);font-weight:600">Power Planner’s Fuel tab</a>.</div></div>`)}
    ${svcBlock("crew", "Production crew", "Stage, sound, lighting and general crew", `<div style="margin-top:12px">${CREW.map(([k,l]) => numField("crew", k, l, 500)).join("")}</div>`)}
    ${svcBlock("equipment", "Equipment hire", "Radios, barriers, fencing, towers", `<div style="margin-top:12px">${EQUIP.map(([k,l]) => numField("equipment", k, l, 5000)).join("")}</div>`)}
    <div class="btn-row"><button class="btn btn-primary btn-block" data-go="estimate" ${anyService() ? "" : "disabled"}>See my estimate</button></div>`;
  const el = $("#screen-services");
  el.querySelectorAll("[data-svc]").forEach(h => h.onclick = e => {
    if(e.target.closest(".svc-body")) return;
    const k = h.dataset.svc; state[k].on = !state[k].on; estimate = null; save(); keep(renderServices);
  });
  el.querySelectorAll("[data-g]").forEach(i => i.oninput = e => { state[i.dataset.g][i.dataset.k] = e.target.value; estimate = null; save(); });
  const g = $("#p-gen"); if(g) g.onchange = e => { state.power.gen = e.target.value; estimate = null; save(); };
  const q = $("#p-qty"); if(q) q.oninput = e => { state.power.qty = e.target.value; estimate = null; save(); };
  const d = $("#p-dist"); if(d) d.onchange = e => { state.power.power_dist = e.target.checked; estimate = null; save(); };
  const ec = $("#p-elec"); if(ec) ec.onchange = e => { state.power.power_elec = e.target.checked; estimate = null; save(); };
  const l = $("#p-litres"); if(l) l.oninput = e => { state.power.litres = e.target.value; estimate = null; save(); };
  bindGo(el);
}

function payload(){
  const pick = (g, list) => Object.assign({on: state[g].on}, ...list.map(([k]) => ({[k]: int(state[g][k])})));
  return {hours: parseFloat(state.hours) || 0, days: int(state.days) || 1,
    security: pick("security", SECURITY), crew: pick("crew", CREW), equipment: pick("equipment", EQUIP),
    power: {on: state.power.on, gen: state.power.gen, qty: int(state.power.qty) || 1, power_dist: !!state.power.power_dist, power_elec: !!state.power.power_elec, litres: int(state.power.litres)}};
}
async function getEstimate(){
  if(!sb) throw new Error("offline");
  const r = await sb.rpc("qe_estimate", {p: payload()});
  if(r.error) throw r.error;
  return r.data;
}

async function renderEstimate(){
  const el = $("#screen-estimate");
  if(!anyService()){ el.innerHTML = `<div class="empty"><h1 id="h-estimate">Estimate</h1><p class="muted">Choose at least one service to see an estimate.</p><button class="btn btn-primary btn-block" data-go="services">Choose services</button></div>`; bindGo(el); return; }
  if(!estimate){
    el.innerHTML = `<h1 id="h-estimate">Estimate</h1><p class="muted">Working it out…</p>`;
    try{ estimate = await getEstimate(); }
    catch(e){ el.innerHTML = `<h1 id="h-estimate">Estimate</h1><div class="status warn"><div><strong>Couldn’t work out the estimate</strong><span class="small muted">Check your connection and try again.</span></div></div><button class="btn btn-primary btn-block" id="retry">Try again</button>`; $("#retry").onclick = renderEstimate; return; }
  }
  const e = estimate, lines = summaryLines();
  const missing = (e.missing || []);
  const priced = e.total > 0;
  el.innerHTML = `
    <h1 id="h-estimate" style="margin-bottom:4px">${esc(state.name || "Your event")}</h1>
    <p class="small muted">${esc((TYPES.find(t => t[0] === state.type) || ["",""])[1])}${state.people ? ", " + int(state.people).toLocaleString("en-GB") + " people" : ""}, ${esc(state.hours || "?")} hours a day for ${int(state.days) || 1} day${int(state.days) > 1 ? "s" : ""}</p>
    ${priced ? `<div class="verdict v-main" role="status"><h3>Estimated cost</h3><div class="big">About ${money(e.total)}</div><p class="muted" style="margin:0">Plus VAT. An estimate to help you budget, not a quote.</p></div>
      <div class="panel"><h2>By service</h2><ul class="lines">${e.sections.map(s => `<li><span>${esc(s.name)}</span><b>${money(s.subtotal)}</b></li>`).join("")}<li class="total"><span>Total, excluding VAT</span><b>${money(e.total)}</b></li></ul></div>`
    : `<div class="status warn"><div><strong>We need to price this one for you</strong><span class="small muted">Request a quote below and we’ll come back with a price.</span></div></div>`}
    ${missing.length ? `<div class="status"><div><strong>Not included in the estimate</strong><span class="small muted">${esc(missing.join(", "))}. We’ll price ${missing.length > 1 ? "these" : "this"} in your quote.</span></div></div>` : ""}
    <div class="panel"><h2>What you asked for</h2><ul class="ticks">${lines.map(l => `<li style="grid-template-columns:1fr"><div><strong>${esc(l)}</strong></div></li>`).join("") || "<li>Nothing yet</li>"}</ul></div>
    <div class="cta no-print">
      <h2>${state.requested ? "Request sent" : "Get a firm quote"}</h2>
      <p class="muted">${state.requested ? "Thanks. We’ll be in touch, usually within a working day. Change anything and send again if you need to." : "We’ll check the details with you and send a confirmed price, usually within a working day."}</p>
      <div class="btn-row">
        <button class="btn btn-primary btn-block" id="ask">${state.requested ? "Send an updated request" : "Request a firm quote"}</button>
        <a class="btn btn-ghost btn-block" href="${WHATSAPP}" target="_blank" rel="noopener">24/7 WhatsApp chat</a>
      </div>
    </div>
    <div class="no-print" style="margin-top:8px"><button class="link-btn" data-go="services">Change services</button> &nbsp; <button class="link-btn" data-go="event">Change event</button></div>
    <p class="disclaimer">This estimate is for budgeting only and isn’t a quote, an offer or a contract. Prices exclude VAT and are based on the details entered and Fort Green’s standard rates at the time. The final price depends on the date, location, access, travel, timings, licensing conditions, risk assessment and availability, and is confirmed only in a written quote. Fort Green Limited accepts no responsibility for decisions made using this estimate.</p>`;
  $("#ask").onclick = openSheet;
  bindGo(el);
}

/* ---------- Request sheet ---------- */
function openSheet(){ $("#overlay").classList.add("on"); $("#sheet").classList.add("on"); setTimeout(() => $("#f-name").focus(), 250); }
function closeSheet(){ $("#overlay").classList.remove("on"); $("#sheet").classList.remove("on"); }
$("#overlay").onclick = closeSheet;
$("#sheet-close").onclick = closeSheet;
document.addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });
$("#lead-form").onsubmit = async ev => {
  ev.preventDefault();
  const email = $("#f-email").value.trim(), err = $("#f-email-err");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ err.textContent = "Enter a valid email address, like name@venue.co.uk."; err.hidden = false; $("#f-email").focus(); return; }
  err.hidden = true;
  const btn = $("#f-send"); btn.disabled = true; btn.textContent = "Sending…";
  const e = estimate || {total:0, sections:[], missing:[]};
  const req = { tool:"quote-estimator", name:$("#f-name").value.trim(), email, phone:$("#f-phone").value.trim(), organisation:$("#f-org").value.trim(),
    notes:$("#f-notes").value.trim().slice(0, 1500), marketing_opt_in:$("#f-mkt").checked,
    event:state.name, type:(TYPES.find(t => t[0] === state.type) || ["",""])[1], date:state.date, postcode:state.postcode, people:int(state.people),
    hours:parseFloat(state.hours) || 0, days:int(state.days) || 1, services:summaryLines().slice(0, 40),
    estimate_total:e.total, estimate_sections:(e.sections || []).map(s => s.name + ": £" + s.subtotal), not_priced:e.missing || [], submitted_at:new Date().toISOString() };
  let ok = false;
  try{ const r = await FGLead.post(QUOTE_ENDPOINT, req); ok = r.ok; }catch(x){}
  btn.disabled = false; btn.textContent = "Send my request";
  if(!ok){ err.textContent = "Couldn’t send your request. Try again, or message us on WhatsApp."; err.hidden = false; return; }
  state.requested = true; save(); closeSheet(); renderEstimate(); window.scrollTo(0,0);
};

/* ---------- Navigation ---------- */
const TABS = ["start","event","services","estimate"];
function go(tab){
  if(tab !== "start" && !state.agreed) tab = "start";
  TABS.forEach(t => $("#screen-" + t).classList.toggle("on", t === tab));
  document.querySelectorAll(".nav button").forEach(b => b.dataset.tab === tab ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  ({start:renderStart, event:renderEvent, services:renderServices, estimate:renderEstimate})[tab]();
  if(location.hash.slice(1) !== tab) history.replaceState(null, "", "#" + tab);
  window.scrollTo(0,0);
}
function keep(fn){ const y = window.scrollY; fn(); window.scrollTo(0, y); }
function bindGo(root){ root.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go)); }
document.querySelectorAll(".nav button").forEach(b => b.onclick = () => go(b.dataset.tab));
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if(TABS.includes(h)) go(h); });
go(TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "start");
</script>
</body>
</html>
