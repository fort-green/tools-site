<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Run sheet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/run-sheet/sheet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/run-sheet/sheet.css">
<style>
:root{--bg:#fbfbfb;--surface:#fff;--ink:#000;--muted:#5f5f5f;--line:#cecece;--accent:#000;--accent-ink:#fff;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#100f10;--surface:#1a191a;--ink:#fff;--muted:#a9a9a9;--line:#3b3a3b;--accent:#fff;--accent-ink:#000;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 18px calc(env(safe-area-inset-bottom,0px) + 40px)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted);margin-bottom:16px}
.bar button{font:600 13px Manrope,sans-serif;background:none;border:1px solid var(--line);color:var(--ink);padding:6px 10px;cursor:pointer}
.msg{padding:40px 0;color:var(--muted)}
.msg h1{font-family:"Antonio","Arial Narrow",sans-serif;text-transform:uppercase;color:var(--ink);font-size:40px;margin:0 0 8px}
footer{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
footer a{color:inherit}
@media print{.bar,footer{display:none}}
</style>
</head>
<body>
<main>
  <div class="bar" id="bar" hidden><span id="updated"></span><button type="button" id="refresh">Refresh</button></div>
  <div id="sheet"><p class="msg">Loading run sheet…</p></div>
  <footer>Shared with <a href="https://www.fortgreen.co.uk" target="_blank" rel="noopener">Fort Green</a> tools. The event organiser is responsible for this run sheet’s content.</footer>
</main>
<script>
(function () {
  var c = window.FG_CONFIG || {};
  var token = new URLSearchParams(location.search).get("t") || "";
  var sb = window.supabase && c.SUPABASE_URL ? window.supabase.createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } }) : null;
  var last = null, lastUpdated = null;
  function gone() {
    document.getElementById("sheet").innerHTML = '<div class="msg"><h1>Link not available</h1><p>This run sheet link has been turned off or doesn’t exist. Ask the event organiser for the current link.</p></div>';
    document.getElementById("bar").hidden = true;
  }
  function paint() {
    if (!last) return;
    document.getElementById("sheet").innerHTML = FGSheet.render(last, { mode: "both", live: true });
    document.title = (last.name || "Run sheet") + " | Run sheet";
    var u = lastUpdated ? new Date(lastUpdated).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
    document.getElementById("updated").textContent = u ? "Last changed " + u : "";
    document.getElementById("bar").hidden = false;
    var now = document.querySelector(".rs-now");
    if (now && !paint.scrolled) { paint.scrolled = true; now.scrollIntoView({ block: "center" }); }
  }
  async function load() {
    if (!sb || !/^[0-9a-f]{64}$/.test(token)) return gone();
    try {
      var r = await sb.rpc("rs_view", { p_token: token });
      if (r.error) throw r.error;
      if (!r.data || !r.data.data) return gone();
      last = r.data.data; lastUpdated = r.data.updated_at; paint();
    } catch (e) {
      if (!last) document.getElementById("sheet").innerHTML = '<p class="msg">Couldn’t load the run sheet. Check your signal and tap Refresh.</p>';
    }
  }
  document.getElementById("refresh").onclick = load;
  load();
  setInterval(load, 60000);              // pick up the organiser's changes
  setInterval(paint, 30000);             // move the "now" highlight along
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") load(); });
})();
</script>
</body>
</html>
