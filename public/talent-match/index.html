<!DOCTYPE html>
<html lang="en-GB">
<head>
<style id="fg-guard">html{visibility:hidden}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/staff-guard.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talent Match | Fort Green</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfbfb;--surface:#fff;--ink:#100f10;--body:#2b2a2b;--muted:#5f5f5f;--line:#cecece;--soft:#f1f1f1;--hatch:#cecece;
  --err:#b42318;--err-soft:#fbe4e1;--warn:#7a5a00;--warn-soft:#fff4cc;--ok:#1d6b3a;--ok-soft:#e3f3e8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#100f10;--surface:#1a191a;--ink:#fff;--body:#e2e2e2;--muted:#a9a9a9;--line:#3b3a3b;--soft:#232223;--hatch:#4a494a;
  --err:#ff7b6e;--err-soft:#2d1513;--warn:#ffd666;--warn-soft:#2e2507;--ok:#7fd69b;--ok-soft:#12271a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Manrope,Arial,sans-serif}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.display{font-family:Antonio,'Arial Narrow',sans-serif;font-weight:700;text-transform:uppercase;line-height:.95;letter-spacing:.005em}
.wrap{max-width:860px;margin:0 auto;padding:0 20px 96px}
.hero{padding-top:40px;padding-bottom:20px}
.hero .kicker{margin:0 0 8px;font-size:15px;font-weight:600;color:var(--muted)}
.hero h1{margin:0;font-size:clamp(52px,11vw,104px)}
.who{font-size:14px;color:var(--muted);margin-top:10px} .who strong{color:var(--ink)}
h2.display{font-size:34px;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:0;font:700 14px Manrope,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{min-height:40px;padding:0 14px;font-size:12px}
.btn.danger{background:transparent;color:var(--err);border-color:var(--err)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;font:600 15px Manrope,Arial,sans-serif;color:var(--ink);text-decoration:underline;cursor:pointer}
.linkbtn.danger{color:var(--err)}
.sechead{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;margin:28px 0 16px}
.hint{margin:0;font-size:14px;color:var(--muted)}
.err{margin:12px 0;padding:12px 14px;background:var(--err-soft);color:var(--err);font-weight:600;font-size:15px}
.okmsg{margin:12px 0;padding:12px 14px;background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:15px}
.empty{border:1px dashed var(--line);padding:36px 20px;text-align:center;color:var(--muted)}
.list{border-top:1px solid var(--ink)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.row:hover{background:var(--soft)}
.row .t{font-weight:700;font-size:17px}
.row .s{font-size:14px;color:var(--muted)}
.pill{display:inline-block;padding:4px 10px;border:1px solid currentColor;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.pill.draft{color:var(--muted)}
.pill.searching{color:var(--warn);background:var(--warn-soft)}
.pill.ready{color:var(--ok);background:var(--ok-soft)}
.pill.failed{color:var(--err);background:var(--err-soft)}
.back{display:inline-block;margin:20px 0 4px;font-weight:600;font-size:15px}
.panel{background:var(--surface);border:1px solid var(--line);padding:18px;margin:14px 0}
.f{display:grid;gap:14px}
.f label,.f .lab{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.f input[type=text],.f input[type=date],.f input[type=time],.f input[type=number],.f input[type=url],.f input[type=email],.f input[type=tel],.f select,.f textarea{width:100%;min-height:46px;padding:9px 12px;border:1.5px solid var(--line);border-radius:0;background:var(--surface);font-size:16px}
.f textarea{min-height:80px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ink);outline:none}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.two>*,.f>*{min-width:0}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.act{border:1px solid var(--ink);background:var(--surface);padding:16px;margin:12px 0}
.act-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.act-top b{font-family:Antonio,'Arial Narrow',sans-serif;font-size:22px;font-weight:700;text-transform:uppercase}
.saving{font-size:13px;color:var(--muted);min-height:20px;margin-top:6px}
.search{border:1px solid var(--ink);padding:18px;margin:22px 0;background:var(--surface)}
.search.on{border-style:dashed}
.spin{display:inline-block;width:16px;height:16px;margin-right:8px;vertical-align:-2px;background:repeating-linear-gradient(135deg,var(--hatch) 0 4px,transparent 4px 7px);box-shadow:inset 0 0 0 1.5px var(--ink);animation:mv 1s linear infinite}
@keyframes mv{to{background-position:14px 0}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:14px 0}
.stats div{background:var(--surface);padding:12px}
.stats b{display:block;font-family:Antonio,'Arial Narrow',sans-serif;font-size:26px;font-weight:700;line-height:1.1}
.stats span{font-size:13px;color:var(--muted)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--soft);padding:4px;margin:16px 0 6px;position:sticky;top:0;z-index:5}
.tabs button{min-height:46px;border:0;background:transparent;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted);padding:4px;line-height:1.2;overflow-wrap:anywhere}
.tabs button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:15px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink);flex:none}
.cand{border:1.5px solid var(--line);background:var(--surface);padding:16px;margin:12px 0;overflow-wrap:anywhere}
.cand.top{border-color:var(--ink)}
.cand-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.cand-head h3{margin:0;font-family:Antonio,'Arial Narrow',sans-serif;font-size:26px;font-weight:700;line-height:1.05}
.rank{font-size:13px;color:var(--muted);font-weight:600}
.score{font-family:Antonio,'Arial Narrow',sans-serif;font-size:36px;font-weight:700;line-height:1;text-align:right}
.score small{font-size:15px;color:var(--muted);font-weight:400}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;background:var(--ink);color:var(--bg)}
.badge.web{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.badge.manual{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.fit{position:relative;height:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);margin:12px 0 4px}
.fit i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.fit.low i{background:repeating-linear-gradient(135deg,var(--hatch) 0 5px,transparent 5px 9px);box-shadow:inset 0 0 0 1px var(--hatch)}
.fit::after{content:"";position:absolute;left:70%;top:-4px;bottom:-4px;width:2px;background:var(--muted)}
.fit-key{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:10px}
.cand p{font-size:15px;margin:0 0 10px}
.flag{font-size:14px;border-left:4px solid var(--line);padding:6px 10px;background:var(--bg);margin:0 0 10px}
.flag.warn{border-left-color:var(--err)}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px;margin:0}
.meta dt{color:var(--muted)} .meta dd{margin:0}
.cand-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:12px}
.cand-actions select{min-height:40px;padding:4px 10px;border:1.5px solid var(--line);background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;border:1.5px solid var(--line);padding:6px 10px;cursor:pointer;margin:0}
.chips input{accent-color:var(--ink);width:16px;height:16px}
input[type=range]{width:100%;accent-color:var(--ink)}
.small{font-size:13px;color:var(--muted)}
.nav{display:flex;gap:0;border-bottom:1px solid var(--ink);margin:4px 0 8px}
.nav a{padding:12px 16px;text-decoration:none;font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid transparent;border-bottom:0;margin-bottom:-1px}
.nav a[aria-current=page]{color:var(--ink);border-color:var(--ink);background:var(--bg)}
.pill.sent,.pill.viewed{color:var(--warn);background:var(--warn-soft)}
.pill.accepted{color:var(--ok);background:var(--ok-soft)}
.pill.declined,.pill.noanswer{color:var(--err);background:var(--err-soft)}
.pill.cancelled{color:var(--muted)}
.pill.performed{color:var(--ink);background:var(--soft)}
.pill.invoiced{color:var(--warn);background:var(--warn-soft)}
.pill.paid{color:var(--ok);background:var(--ok-soft)}
.steps{font-size:14px;color:var(--muted);margin:4px 0 0}
.steps b{display:inline-grid;place-items:center;width:20px;height:20px;background:var(--ink);color:var(--bg);font-size:12px;margin-right:4px}
.row>.btn,.row>.pill{justify-self:end}
.nav{overflow-x:auto}
.nav a{white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.filters button{min-height:38px;padding:0 12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px}
.filters button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.actions{display:grid;gap:10px;margin:14px 0}
.timeline{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.timeline li{display:grid;grid-template-columns:112px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.timeline time{color:var(--muted)}
.readonly{background:var(--soft);padding:10px 14px;font-size:14px;margin:10px 0}
.disclaimer{font-size:13px;color:var(--muted);margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <p class="kicker">Staff tool</p>
    <h1 class="display">Talent Match</h1>
    <div class="who" id="who"></div>
  </header>
  <div id="app"><p class="hint">Loading…</p></div>
</main>

<script>
(function () {
  var c = window.FG_CONFIG || {};
  var sb = window.supabase.createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY);
  var app = document.getElementById("app");
  var me = { email: "", admin: false };
  var TYPES = ["Headliner or name act","Live band","DJ","Solo or acoustic","MC or host","Comedian","Dancers or performers","Walkabout or circus","Children’s entertainer","Speaker or presenter"];
  var EVENT_TYPES = [["festival","Festival"],["club","Club night"],["venue","Venue or bar"],["corporate","Corporate"],["private","Private or wedding"],["brand","Brand activation"]];
  var PLATFORMS = ["Web","Instagram","TikTok","Facebook","Mixcloud"];
  var STATUSES = ["To contact","Contacted","Quoted","Not available","Booked"];
  var state = { brief: null, cands: [], bookings: [], tab: null, hideOver: true, editing: null, channel: null, poll: null, mode: "list", gigFilter: "upcoming" };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]; }); }
  function safeUrl(u) { u = String(u || "").trim(); return /^https?:\/\//i.test(u) ? u : ""; }
  function host(u) { var m = String(u).match(/^https?:\/\/(?:www\.)?([^\/?#]+)/i); return m ? m[1] : u; }
  function gbp(v) { var n = parseFloat(v); return isNaN(n) ? "No budget set" : "£" + n.toLocaleString("en-GB"); }
  function fmtDate(d) { if (!d) return ""; var x = new Date(d + "T12:00:00"); return isNaN(x) ? d : x.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" }); }
  function ago(t) { if (!t) return ""; var m = Math.round((Date.now() - new Date(t)) / 60000); return m < 1 ? "just now" : m < 60 ? m + " min ago" : new Date(t).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
  function uid() { return "a" + Math.random().toString(36).slice(2, 9); }
  function keep(fn) { var y = window.scrollY; fn(); window.scrollTo(0, y); }
  function debounce(fn, ms) { var t; return function () { var a = arguments; clearTimeout(t); t = setTimeout(function () { fn.apply(null, a); }, ms); }; }
  function stopLive() { if (state.channel) { sb.removeChannel(state.channel); state.channel = null; } if (state.poll) { clearInterval(state.poll); state.poll = null; } }
  function errMsg(e) { return (e && (e.message || e.error_description)) || "Something went wrong. Try again."; }
  function today() { return new Date().toLocaleDateString("en-CA", { timeZone: "Europe/London" }); }

  /* ---------- Venues: client-portal venues plus any added here ---------- */
  var VN = (function () {
    var list = null;
    async function load(force) {
      if (list && !force) return list;
      var r = await sb.from("tm_venue_list").select("*").order("name");
      if (r.error) throw r.error;
      list = r.data || []; return list;
    }
    function byId(id) { return (list || []).find(function (v) { return v.id === id; }) || null; }
    function where(v) { return v ? [v.address, v.town].filter(Boolean).join(", ") : ""; }
    function options(sel) {
      return '<option value="">Choose a venue…</option>' + (list || []).map(function (v) { return '<option value="' + v.id + '"' + (v.id === sel ? " selected" : "") + ">" + esc(v.name) + "</option>"; }).join("") +
        (sel && !byId(sel) ? '<option value="' + esc(sel) + '" selected>Venue no longer on the list</option>' : "") +
        '<option value="__new">+ Add a new venue…</option>';
    }
    // Inline "add a venue" form. done(venue) gets the new row, or null if cancelled.
    function addForm(el, done) {
      el.innerHTML = '<div class="panel f" style="border-color:var(--ink)"><div class="sechead" style="margin:0"><h2 class="display" style="font-size:22px">New venue</h2><button type="button" class="linkbtn" id="nv-x">Cancel</button></div>' +
        '<div><label for="nv-name">Venue name</label><input type="text" id="nv-name" placeholder="e.g. Victoria Park, East Stage"></div>' +
        '<div class="two"><div><label for="nv-addr">Address</label><input type="text" id="nv-addr" placeholder="Street and postcode"></div><div><label for="nv-town">Town or area</label><input type="text" id="nv-town" placeholder="e.g. Hackney, London"></div></div>' +
        '<div id="nv-msg"></div><button type="button" class="btn block" id="nv-save">Add venue</button>' +
        '<p class="hint">Added to the venue list for Talent Match. Client-portal venues come from Staff Check-In.</p></div>';
      document.getElementById("nv-name").focus();
      document.getElementById("nv-x").onclick = function () { el.innerHTML = ""; done(null); };
      document.getElementById("nv-save").onclick = async function () {
        var name = document.getElementById("nv-name").value.trim();
        if (!name) { document.getElementById("nv-msg").innerHTML = '<p class="err">Enter the venue name.</p>'; return; }
        this.disabled = true;
        var r = await sb.from("tm_venues").insert({ name: name, address: document.getElementById("nv-addr").value.trim(), town: document.getElementById("nv-town").value.trim() }).select().single();
        if (r.error) { this.disabled = false; document.getElementById("nv-msg").innerHTML = '<p class="err">' + esc(errMsg(r.error)) + "</p>"; return; }
        await load(true);
        el.innerHTML = ""; done(byId(r.data.id) || Object.assign({ source: "talent" }, r.data));
      };
    }

    async function viewVenues() {
      stopLive();
      app.innerHTML = TB.nav("venues") + '<p class="hint">Loading venues…</p>';
      var bk;
      try { await load(true); bk = await sb.from("tm_bookings").select("venue_id,status,event_date"); } catch (e) { app.innerHTML = TB.nav("venues") + '<p class="err">' + esc(errMsg(e)) + "</p>"; return; }
      var t = today(), counts = {};
      (bk.data || []).forEach(function (b) { if (!b.venue_id) return; var c = counts[b.venue_id] = counts[b.venue_id] || { up: 0, all: 0 }; c.all++; if (b.event_date >= t && ["declined", "cancelled"].indexOf(b.status) < 0) c.up++; });
      app.innerHTML = TB.nav("venues") +
        '<div class="sechead"><h2 class="display">Venues</h2><button class="btn" id="add-v">Add venue</button></div>' +
        '<p class="hint">Every booking sits against one of these venues. Client-portal venues come from Staff Check-In; add one-off venues (festivals, private sites) here.</p><div id="v-new"></div>' +
        ((list || []).length ? '<div class="list" style="margin-top:14px">' + list.map(function (v) {
          var c = counts[v.id] || { up: 0, all: 0 };
          return '<a class="row" href="#v=' + v.id + '"><div><div class="t">' + esc(v.name) + '</div><div class="s">' + esc([where(v), c.up + " upcoming booking" + (c.up === 1 ? "" : "s"), c.all + " in total"].filter(Boolean).join(" · ")) + "</div></div>" +
            '<span class="pill ' + (v.source === "portal" ? "ready" : "draft") + '">' + (v.source === "portal" ? "Client portal" : "Added here") + "</span></a>";
        }).join("") + "</div>" : '<div class="empty" style="margin-top:14px">No venues yet.</div>');
      document.getElementById("add-v").onclick = function () { addForm(document.getElementById("v-new"), function (v) { if (v) location.hash = "#v=" + v.id; }); };
    }

    async function viewVenue(id) {
      stopLive();
      app.innerHTML = TB.nav("venues") + '<p class="hint">Loading venue…</p>';
      try { await load(true); } catch (e) { app.innerHTML = TB.nav("venues") + '<p class="err">' + esc(errMsg(e)) + "</p>"; return; }
      var v = byId(id);
      if (!v) { app.innerHTML = TB.nav("venues") + '<a class="back" href="#venues">← Venues</a><p class="err">This venue isn’t on the list any more.</p>'; return; }
      var g = await sb.from("tm_briefs").select("id,name,event").eq("venue_id", id);
      var b = await sb.from("tm_bookings").select("id,ref,artist_name,act_label,event_name,event_date,fee,status,no_response_flagged_at").eq("venue_id", id).order("event_date", { ascending: false });
      var gigs = (g.data || []).sort(function (p, q) { return String((q.event || {}).date || "").localeCompare(String((p.event || {}).date || "")); });
      var bks = b.data || [];
      app.innerHTML = TB.nav("venues") + '<a class="back" href="#venues">← Venues</a>' +
        '<div class="sechead" style="margin-top:8px"><h2 class="display">' + esc(v.name) + '</h2><span class="pill ' + (v.source === "portal" ? "ready" : "draft") + '">' + (v.source === "portal" ? "Client portal" : "Added here") + "</span></div>" +
        (where(v) ? '<p class="hint">' + esc(where(v)) + "</p>" : "") +
        TB.statsHtml(bks) +
        '<div class="sechead"><h2 class="display" style="font-size:26px">Bookings</h2>' + (me.admin ? '<button class="btn sm" id="v-gig">New gig here</button>' : "") + "</div>" +
        (bks.length ? '<div class="list">' + bks.map(TB.rowHtml).join("") + "</div>" : '<div class="empty">No bookings at this venue yet.</div>') +
        '<div class="sechead"><h2 class="display" style="font-size:26px">Gigs</h2></div>' +
        (gigs.length ? '<div class="list">' + gigs.map(function (x) { return '<a class="row" href="#b=' + x.id + '"><div><div class="t">' + esc(x.name || "Untitled gig") + '</div><div class="s">' + esc(fmtDate((x.event || {}).date) || "No date") + "</div></div></a>"; }).join("") + "</div>" : '<div class="empty">No gigs at this venue yet.</div>') +
        (v.source === "talent" ? '<div style="margin-top:28px"><button type="button" class="linkbtn danger" id="v-del">Remove this venue from the list</button></div>' : "") +
        '<p class="disclaimer">' + (v.source === "portal" ? "This venue comes from Staff Check-In; change its name or address there." : "Removing a venue keeps its gigs and bookings; they just no longer show it on the list.") + "</p>";
      var ng = document.getElementById("v-gig"); if (ng) ng.onclick = function () { newGig(id); };
      var del = document.getElementById("v-del");
      if (del) del.onclick = async function () {
        if (del.dataset.armed !== "1") { del.dataset.armed = "1"; del.textContent = "Tap again to remove " + v.name; return; }
        var r = await sb.from("tm_venues").update({ active: false }).eq("id", id);
        if (r.error) { del.textContent = errMsg(r.error); return; }
        location.hash = "#venues";
      };
    }

      .on("postgres_changes", { event: "*", schema: "public", table: "tm_bookings", filter: "brief_id=eq." + id }, debounce(function () { loadGigBookings().then(function () { keep(renderGigBookings); }); }, 800))

  function renderSearch() {

    } else {

  /* ----- Search results ----- */
  function viewCard(x, rank, label) {
    var links = PLATFORMS.slice(1).filter(function (p) { return safeUrl(x[p.toLowerCase()]); }).map(function (p) { return '<a href="' + esc(safeUrl(x[p.toLowerCase()])) + '" target="_blank" rel="noopener">' + p + "</a>"; });
    if (safeUrl(x.website)) links.unshift('<a href="' + esc(safeUrl(x.website)) + '" target="_blank" rel="noopener">' + esc(host(x.website)) + "</a>");
    var other = (x.sources || []).filter(function (u) { return safeUrl(u) && u !== x.website && PLATFORMS.slice(1).every(function (p) { return u !== x[p.toLowerCase()]; }); });
    other.forEach(function (u) { links.push('<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(host(u)) + "</a>"); });
    var score = Math.max(0, Math.min(100, x.score | 0));
    var bk = state.bookings.find(function (k) { return k.candidate_id === x.id && live(k); });
    return '<div class="cand ' + (rank === 1 ? "top" : "") + '" id="card-' + x.id + '">' +

      '<div class="badges">' + (x.found_on || []).map(function (p) { return '<span class="badge ' + (p === "Web" ? "web" : "") + '">' + esc(p) + "</span>"; }).join("") + (x.roster_id ? '<span class="badge">On our list</span>' : "") + (x.origin === "manual" ? '<span class="badge manual">Added by ' + esc((x.created_by || "").split("@")[0]) + "</span>" : "") + "</div>" +
      '<div class="fit ' + (score < 70 ? "low" : "") + '" aria-hidden="true"><i style="width:' + score + '%"></i></div><div class="fit-key"><span>Fit with the gig</span><span>Strong fit from 70</span></div>' +
      (x.why ? "<p>" + esc(x.why) + "</p>" : "") +
      (x.concern ? '<div class="flag ' + (x.over_budget ? "warn" : "") + '">' + esc(x.concern) + "</div>" : "") +
      '<dl class="meta"><dt>Following</dt><dd>' + esc(x.followers || "Not shown") + "</dd><dt>Based</dt><dd>" + esc(x.based || "Not shown") + "</dd><dt>Booking</dt><dd>" + esc(x.booking || "Not shown") + "</dd><dt>Links</dt><dd>" + (links.join(" · ") || "None") + "</dd>" +
      (x.notes ? "<dt>Notes</dt><dd>" + esc(x.notes) + "</dd>" : "") + "</dl>" +
      '<div class="cand-actions">' +
      (bk ? '<a class="btn sm" href="#k=' + bk.id + '">In bookings: ' + esc(TB.label(bk)) + "</a>" : me.admin ? '<button type="button" class="btn sm" data-book="' + x.id + '">Add to bookings</button>' : "") +
      '<button type="button" class="btn ghost sm" data-edit="' + x.id + '">Edit</button>' +
      (x.roster_id ? "" : '<button type="button" class="btn ghost sm" data-to-roster="' + x.id + '">Save to our list</button>') +
      '<button type="button" class="linkbtn" data-hide="' + x.id + '">Not for this gig</button>' +
      '<span class="small">Updated by ' + esc(x.updated_by === "system" ? "search" : (x.updated_by || "").split("@")[0]) + " " + esc(ago(x.updated_at)) + "</span></div></div>";
  }

  function editCard(x) {
    function inp(k, label, type, ph) { return '<div><label for="x-' + k + '">' + label + '</label><input type="' + (type || "text") + '" id="x-' + k + '" data-f="' + k + '" value="' + esc(x[k]) + '"' + (ph ? ' placeholder="' + ph + '"' : "") + "></div>"; }
    return '<div class="cand top" id="card-' + x.id + '"><div class="cand-head"><div><div class="rank">' + (x.id ? "Editing" : "New act") + "</div><h3>" + esc(x.name || "New act") + "</h3></div></div>" +
      '<form class="f" id="edit-form" style="margin-top:12px" novalidate>' +
      inp("name", "Name") +
      '<div><label for="x-score">Fit score: <output id="o-score">' + (x.score | 0) + '</output>/100</label><input type="range" id="x-score" data-f="score" min="0" max="100" value="' + (x.score | 0) + '"></div>' +
      '<div><label for="x-why">Why they fit</label><textarea id="x-why" data-f="why">' + esc(x.why) + "</textarea></div>" +
      '<div><label for="x-concern">Concerns</label><textarea id="x-concern" data-f="concern">' + esc(x.concern) + "</textarea></div>" +
      '<label class="check" style="margin:0"><input type="checkbox" data-f="over_budget"' + (x.over_budget ? " checked" : "") + "><span>Likely well over budget</span></label>" +
      '<div><span class="lab">Found on</span><div class="chips">' + PLATFORMS.map(function (p) { return '<label><input type="checkbox" data-found="' + p + '"' + ((x.found_on || []).indexOf(p) > -1 ? " checked" : "") + ">" + p + "</label>"; }).join("") + "</div></div>" +
      '<div class="two">' + inp("followers", "Following") + inp("based", "Based") + "</div>" +
      inp("booking", "Booking contact") +
      inp("website", "Website", "url", "https://") +
      '<div class="two">' + inp("instagram", "Instagram", "url", "https://") + inp("tiktok", "TikTok", "url", "https://") + "</div>" +
      '<div class="two">' + inp("facebook", "Facebook", "url", "https://") + inp("mixcloud", "Mixcloud", "url", "https://") + "</div>" +
      '<div><label for="x-notes">Team notes</label><textarea id="x-notes" data-f="notes" placeholder="Quotes, availability, who spoke to them">' + esc(x.notes) + "</textarea></div>" +
      '<div id="edit-msg"></div>' +
      '<div style="display:grid;gap:10px"><button type="submit" class="btn block">Save</button><button type="button" class="btn ghost block" id="edit-cancel">Cancel</button>' +
      (x.id ? '<button type="button" class="btn danger block" id="edit-del">Remove from results</button>' : "") + "</div></form></div>";
  }

  function renderShortlist() {
    var el = document.getElementById("shortlist"); if (!el) return;
    var b = state.brief;
    if (!b.acts.length) { el.innerHTML = ""; return; }
    if (!b.acts.some(function (a) { return a.id === state.tab; })) state.tab = b.acts[0].id;
    var act = b.acts.find(function (a) { return a.id === state.tab; });
    var label = act.label || act.type || "act";
    var all = state.cands.filter(function (x) { return x.act_id === state.tab && x.status !== "Not available"; }).sort(function (p, q) { return q.score - p.score; });
    if (state.editing && state.editing.id === null && state.editing.act_id === state.tab) all = all.concat([state.editing]);
    var visible = all.filter(function (x) { return !(state.hideOver && x.over_budget) || (state.editing && state.editing.id === x.id); });
    var hidden = all.length - visible.length;
    if (!state.cands.length && b.status !== "searching" && !state.editing) { el.innerHTML = '<button type="button" class="linkbtn" id="add-cand" style="margin-top:10px">Or add an act you found yourself</button>'; bindShortlist(el); return; }
    el.innerHTML =
      '<div class="sechead"><h2 class="display" style="font-size:26px">Results</h2></div>' +
      (b.acts.length > 1 ? '<div class="tabs" role="group" aria-label="Act">' + b.acts.map(function (a) { return '<button type="button" data-tab="' + a.id + '" aria-pressed="' + (a.id === state.tab) + '">' + esc(a.label || a.type) + "</button>"; }).join("") + "</div>" : "") +
      '<p class="hint" style="margin-top:8px">' + esc([act.style, act.set].filter(Boolean).join(" · ")) + " · budget " + esc(gbp(act.budget)) + "</p>" +
      '<label class="check"><input type="checkbox" id="hide"' + (state.hideOver ? " checked" : "") + "><span>Hide acts likely to be well over budget</span></label>" +
      (all.length ? "" : '<div class="empty">' + (b.status === "searching" ? "Results will appear here when the search finishes." : "No results for this act yet.") + "</div>") +
      visible.map(function (x) { return state.editing && state.editing.id === x.id ? editCard(state.editing) : viewCard(x, all.indexOf(x) + 1, label); }).join("") +
      (hidden ? '<p class="hint">' + hidden + " act" + (hidden > 1 ? "s" : "") + " hidden as likely over budget.</p>" : "") +
      (state.editing ? "" : '<button type="button" class="btn ghost block" id="add-cand" style="margin-top:8px">Add an act you found yourself</button>');
    bindShortlist(el);
  }

  function bindShortlist(el) {
    el.querySelectorAll("[data-tab]").forEach(function (t) { t.onclick = function () { state.tab = t.dataset.tab; state.editing = null; renderShortlist(); }; });
    var h = document.getElementById("hide"); if (h) h.onchange = function (ev) { state.hideOver = ev.target.checked; keep(renderShortlist); };
    el.querySelectorAll("[data-hide]").forEach(function (btn) {
      btn.onclick = async function () {
        var x = state.cands.find(function (y) { return y.id === btn.dataset.hide; });
        var r = await sb.from("tm_candidates").update({ status: "Not available" }).eq("id", x.id).select().single();
        if (r.error) { alert(errMsg(r.error)); return; }
        Object.assign(x, r.data); keep(renderShortlist);
      };
    });
    el.querySelectorAll("[data-edit]").forEach(function (btn) {
      btn.onclick = function () { var x = state.cands.find(function (y) { return y.id === btn.dataset.edit; }); state.editing = JSON.parse(JSON.stringify(x)); keep(renderShortlist); var n = document.getElementById("x-name"); if (n) n.focus(); };
    });
    el.querySelectorAll("[data-book]").forEach(function (btn) {
      btn.onclick = async function () {
        var x = state.cands.find(function (y) { return y.id === btn.dataset.book; });
        btn.disabled = true; btn.textContent = "Adding…";
        var r = await TB.bookFromCandidate(state.brief, x);
        if (r.error) { btn.disabled = false; btn.textContent = "Add to bookings"; alert(errMsg(r.error)); return; }
        await loadGigBookings(); renderGigBookings(); keep(renderShortlist);
      };
    });
    el.querySelectorAll("[data-to-roster]").forEach(function (btn) {
      btn.onclick = function () { RS.fromCandidate(state.cands.find(function (y) { return y.id === btn.dataset.toRoster; })); };
    });
    var add = document.getElementById("add-cand");
    if (add) add.onclick = function () {
      state.editing = { id: null, act_id: state.tab, name: "", score: 60, why: "", concern: "", over_budget: false, found_on: ["Web"], followers: "", based: "", booking: "", website: "", instagram: "", tiktok: "", facebook: "", mixcloud: "", notes: "", origin: "manual", status: "To contact" };
      renderShortlist(); var n = document.getElementById("x-name"); if (n) { n.scrollIntoView({ block: "center" }); n.focus(); }
    };
    var form = document.getElementById("edit-form");
    if (form) bindEdit(form);
  }
  function bindEdit(form) {
    var x = state.editing;
    form.querySelectorAll("[data-f]").forEach(function (i) {
      i[i.type === "checkbox" ? "onchange" : "oninput"] = function () {
        x[i.dataset.f] = i.type === "checkbox" ? i.checked : i.type === "range" ? parseInt(i.value, 10) : i.value;
        if (i.dataset.f === "score") document.getElementById("o-score").textContent = i.value;
      };
    });
    form.querySelectorAll("[data-found]").forEach(function (i) { i.onchange = function () { x.found_on = PLATFORMS.filter(function (p) { return form.querySelector('[data-found="' + p + '"]').checked; }); }; });
    form.onsubmit = async function (ev) {
      ev.preventDefault();
      var msg = document.getElementById("edit-msg");
      if (!String(x.name).trim()) { msg.innerHTML = '<p class="err">Enter the act’s name.</p>'; document.getElementById("x-name").focus(); return; }
      var bad = ["website", "instagram", "tiktok", "facebook", "mixcloud"].filter(function (k) { return x[k] && !safeUrl(x[k]); });
      if (bad.length) { msg.innerHTML = '<p class="err">Links must start with https:// (check ' + bad.join(", ") + ").</p>"; return; }
      var row = { name: x.name.trim(), score: x.score | 0, why: x.why, concern: x.concern, over_budget: !!x.over_budget, found_on: x.found_on, followers: x.followers, based: x.based, booking: x.booking,
        website: x.website, instagram: x.instagram, tiktok: x.tiktok, facebook: x.facebook, mixcloud: x.mixcloud, notes: x.notes };
      var r = x.id
        ? await sb.from("tm_candidates").update(row).eq("id", x.id).select().single()
        : await sb.from("tm_candidates").insert(Object.assign(row, { brief_id: state.brief.id, act_id: x.act_id, origin: "manual" })).select().single();
      if (r.error) { msg.innerHTML = '<p class="err">' + esc(errMsg(r.error)) + "</p>"; return; }
      var i = state.cands.findIndex(function (y) { return y.id === r.data.id; });
      if (i > -1) state.cands[i] = r.data; else state.cands.push(r.data);
      state.editing = null; renderShortlist();
      var card = document.getElementById("card-" + r.data.id); if (card) card.scrollIntoView({ block: "center" });
    };
    document.getElementById("edit-cancel").onclick = function () { var id = x.id; state.editing = null; renderShortlist(); var card = id && document.getElementById("card-" + id); if (card) card.scrollIntoView({ block: "center" }); };
    var del = document.getElementById("edit-del");
    if (del) del.onclick = async function () {
      if (del.dataset.armed !== "1") { del.dataset.armed = "1"; del.textContent = "Tap again to remove"; return; }
      var r = await sb.from("tm_candidates").delete().eq("id", x.id);
      if (r.error) { document.getElementById("edit-msg").innerHTML = '<p class="err">' + esc(errMsg(r.error)) + "</p>"; return; }
      state.cands = state.cands.filter(function (y) { return y.id !== x.id; }); state.editing = null; keep(renderShortlist);
    };
  }

  /* ----- This gig's bookings ----- */
  function renderGigBookings() {
    var el = document.getElementById("gig-bookings"); if (!el) return;
    var rows = state.bookings;
    el.innerHTML = rows.length ? '<div class="list">' + rows.map(TB.rowHtml).join("") + "</div>" +
      '<p class="hint" style="margin-top:10px">Open a booking to set the fee and times, then send it to the artist by email or WhatsApp.</p>'
      : '<div class="empty">Nothing booked yet. Add talent from our list or from the search results and it appears here, and in Bookings.</div>';
  }

  /* ---------- Booking management (admins book; staff can view) ---------- */
  var TB = (function () {
    var CONFIRM_BASE = "https://tools.fortgreen.co.uk/talent-match/confirm/#t=";
    var DEFAULT_TERMS = [
      "1. This booking is between the artist named above and Fort Green Limited, on behalf of its client.",
      "2. The artist will arrive for load-in and soundcheck at the times shown and perform the agreed set times. The licence holder's curfew and any noise limit must be kept to.",
      "3. The fee covers the performance as described. Anything else (travel, accommodation, extra time) must be agreed in writing beforehand.",
      "4. Payment is made as set out in the payment terms, on receipt of an invoice from the artist.",
      "5. If the artist cancels, they will tell Fort Green as soon as possible and return any deposit. If Fort Green cancels less than 14 days before the event for reasons within its control, the deposit is kept by the artist.",
      "6. The artist is responsible for their own equipment, including its electrical safety, and holds their own public liability insurance unless agreed otherwise.",
      "7. Filming, recording and promotion of the performance follow what is agreed in the booking. The artist allows Fort Green and its client to use their name and image to promote the event.",
      "8. Both sides will follow the venue's safety rules and the instructions of the event's security and production teams on the night."
    ].join("\n");
    var LABEL = { draft: "Shortlisted", sent: "Offer sent", viewed: "Offer opened", accepted: "Confirmed", performed: "Performed", invoiced: "Invoiced", paid: "Paid", declined: "Declined", cancelled: "Cancelled" };
    var LOGTEXT = { invite: "Booking request emailed", updated: "Updated details emailed", chase: "Automatic chaser emailed", manual_reminder: "Reminder emailed",
      whatsapp: "Sent on WhatsApp", viewed: "Artist opened the booking", accepted: "Artist confirmed", declined: "Artist declined", cancelled: "Booking cancelled",
      reopened: "Reopened as shortlisted", reminder_7d: "7-day reminder emailed", reminder_1d: "1-day reminder emailed", no_response: "No answer after 3 chasers: admins told" };
    // CRM stages, in order. Each covers one or more booking statuses.
    var STAGES = [
      ["shortlisted", "Shortlisted", ["draft"]],
      ["offer", "Offer sent", ["sent", "viewed"]],
      ["confirmed", "Confirmed", ["accepted"]],
      ["performed", "Performed", ["performed"]],
      ["invoiced", "Invoiced", ["invoiced"]],
      ["paid", "Paid", ["paid"]],
      ["closed", "Declined or cancelled", ["declined", "cancelled"]]
    ];
    var crm = { stage: "active", venue: "", q: "" }, cur = null, logRows = [], prefs = null;

    function nav(active) {
      var items = [["gigs", "#", "Gigs"], ["bookings", "#bookings", "Bookings"], ["venues", "#venues", "Venues"], ["roster", "#roster", "Our talent"]];
      return '<nav class="nav" aria-label="Talent Match">' + items.map(function (i) { return '<a href="' + i[1] + '"' + (active === i[0] ? ' aria-current="page"' : "") + ">" + i[2] + "</a>"; }).join("") + "</nav>";
    }
    function phone(p) {
      var s = String(p || "").replace(/[^\d+]/g, "");
      if (/^07\d{9}$/.test(s)) s = "+44" + s.slice(1);
      if (/^447\d{9}$/.test(s)) s = "+" + s;
      return /^\+\d{8,15}$/.test(s) ? s : "";
    }
    function noAnswer(b) { return b.no_response_flagged_at && (b.status === "sent" || b.status === "viewed"); }
    function label(b) { return noAnswer(b) ? "No answer" : LABEL[b.status] || b.status; }
    function pill(b) { return '<span class="pill ' + (noAnswer(b) ? "noanswer" : b.status) + '">' + esc(label(b)) + "</span>"; }
    function money(v) { return v === null || v === undefined || v === "" ? "" : "£" + Number(v).toLocaleString("en-GB", { maximumFractionDigits: 2 }); }
    function link(b) { return CONFIRM_BASE + b.token; }
    function waText(b, kind) {
      var who = (b.artist_contact || b.artist_name || "").split(" ")[0];
      var when = fmtDate(b.event_date);
      var lines = kind === "invite"
        ? ["Hi " + who + ", it's Fort Green. We'd like to book " + (b.act_label || b.artist_name) + " for " + (b.event_name || b.venue_name) + (b.venue_name && b.event_name ? " at " + b.venue_name : "") + " on " + when + (b.fee ? ", fee " + money(b.fee) : "") + ".",
           "Full details, terms and to confirm: " + link(b)]
        : b.status === "accepted"
          ? ["Hi " + who + ", a reminder from Fort Green about your booking at " + (b.venue_name || b.event_name) + " on " + when + (b.load_in ? ", load-in " + b.load_in : "") + ".", "Details: " + link(b)]
          : ["Hi " + who + ", Fort Green here. Could you confirm whether you can do " + (b.event_name || b.venue_name) + " on " + when + "? It only takes a minute:", link(b)];
      return lines.join("\n\n");
    }
    // Needs someone to do something: no answer, declined, or a past gig not yet marked performed / invoiced.
    function needsAction(b, t) {
      return noAnswer(b) || (b.status === "accepted" && b.event_date && b.event_date < t) || b.status === "performed";
    }
    function rowHtml(b) {
      var bits = [fmtDate(b.event_date), b.venue_name, b.event_name && b.event_name !== b.venue_name ? b.event_name : "", money(b.fee),
        b.status === "sent" || b.status === "viewed" ? (b.chase_count ? b.chase_count + " chaser" + (b.chase_count > 1 ? "s" : "") + " sent" : "sent " + ago(b.sent_at)) : ""].filter(Boolean).join(" · ");
      return '<a class="row" href="#k=' + b.id + '"><div><div class="t">' + esc(b.artist_name || "Unnamed artist") + (b.act_label ? ' <span class="small">(' + esc(b.act_label) + ")</span>" : "") + '</div><div class="s">' + esc(bits) + (b.ref ? " · " + esc(b.ref) : "") + "</div></div>" + pill(b) + "</a>";
    }
    function sum(rows, sts) { return rows.filter(function (b) { return sts.indexOf(b.status) > -1; }).reduce(function (n, b) { return n + (parseFloat(b.fee) || 0); }, 0); }
    function statsHtml(rows) {
      return '<div class="stats four"><div><b>' + money(sum(rows, ["accepted"])) + '</b><span>confirmed, not yet played</span></div><div><b>' + money(sum(rows, ["performed"])) +
        '</b><span>played, to invoice</span></div><div><b>' + money(sum(rows, ["invoiced"])) + '</b><span>invoiced, unpaid</span></div><div><b>' + money(sum(rows, ["paid"])) + "</b><span>paid</span></div></div>";
    }

    /* ----- Bookings CRM ----- */
    async function viewBookings() {
      stopLive();
      app.innerHTML = nav("bookings") + '<p class="hint">Loading bookings…</p>';
      try { await VN.load(); } catch (e) { /* filter just won't list venues */ }
      var r = await sb.from("tm_bookings").select("id,ref,brief_id,venue_id,artist_name,act_label,event_name,event_date,venue_name,fee,status,chase_count,no_response_flagged_at,sent_at,responded_at").order("event_date", { ascending: true, nullsFirst: false });
      if (r.error) { app.innerHTML = nav("bookings") + '<p class="err">' + esc(errMsg(r.error)) + "</p>"; return; }
      var all = r.data || [], t = today();
      var usedVenues = all.map(function (b) { return b.venue_id; }).filter(function (v, i, s) { return v && s.indexOf(v) === i; });
      app.innerHTML = nav("bookings") +
        '<div class="sechead"><h2 class="display">Bookings</h2>' + (me.admin ? '<button class="btn" id="new-bk">New booking</button>' : "") + "</div>" +
        '<p class="hint">' + (me.admin ? "Every act added to a gig lands here as Shortlisted. Send the offer by email or WhatsApp; unanswered offers are chased by email every 2 days (3 times) and confirmed artists get reminders 7 days and 1 day before. After the gig, mark it performed, invoiced and paid." : "You can view bookings. Only admins can create and send them.") + "</p>" +
        '<div class="f two" style="margin:14px 0 0"><div><label for="c-v">Venue</label><select id="c-v"><option value="">All venues</option>' +
          (usedVenues.map(function (id) { var v = VN.byId(id); return '<option value="' + id + '"' + (crm.venue === id ? " selected" : "") + ">" + esc(v ? v.name : "Removed venue") + "</option>"; }).join("")) +
          '<option value="none"' + (crm.venue === "none" ? " selected" : "") + ">No venue set</option></select></div>" +
          '<div><label for="c-q">Search</label><input type="text" id="c-q" value="' + esc(crm.q) + '" placeholder="Artist, gig or reference"></div></div>' +
        '<div id="c-body"></div>';
      var draw = function () {
        var s = crm.q.toLowerCase();
        var base = all.filter(function (b) {
          return (!crm.venue || (crm.venue === "none" ? !b.venue_id : b.venue_id === crm.venue)) &&
            (!s || [b.artist_name, b.act_label, b.event_name, b.venue_name, b.ref].join(" ").toLowerCase().indexOf(s) > -1);
        });
        var groups = { active: function (b) { return ["declined", "cancelled", "paid"].indexOf(b.status) < 0; }, attention: function (b) { return needsAction(b, t); } };
        STAGES.forEach(function (st) { groups[st[0]] = function (b) { return st[2].indexOf(b.status) > -1; }; });
        groups.all = function () { return true; };
        var names = [["active", "Open"], ["attention", "Needs action"]].concat(STAGES.map(function (st) { return [st[0], st[1]]; })).concat([["all", "All"]]);
        var list = base.filter(groups[crm.stage] || groups.active);
        if (crm.stage === "paid" || crm.stage === "closed") list.reverse();
        document.getElementById("c-body").innerHTML = statsHtml(base) +
          '<div class="filters" role="group" aria-label="Stage">' + names.map(function (n) { return '<button type="button" data-st="' + n[0] + '" aria-pressed="' + (n[0] === crm.stage) + '">' + n[1] + " (" + base.filter(groups[n[0]]).length + ")</button>"; }).join("") + "</div>" +
          (list.length ? '<div class="list">' + list.map(function (b) {
            var html = rowHtml(b);
            if (crm.stage === "attention") {
              var why = noAnswer(b) ? "No answer after 3 chasers" : b.status === "accepted" ? "Gig has passed: mark as performed" : "Played: invoice it";
              html = html.replace('</div></div><span class="pill', ' · <strong>' + esc(why) + '</strong></div></div><span class="pill');
            }

        '<p class="hint">Acts we already work with. Add them to any gig from “From our list”; their email and WhatsApp are used when you send the booking.</p>' +
        '<div class="f two" style="margin:14px 0"><div><label for="rs-q">Search</label><input type="text" id="rs-q" value="' + esc(q) + '" placeholder="Name, style, area"></div>' +
        '<div><label for="rs-t">Type of act</label><select id="rs-t"><option value="">All types</option>' + types.map(function (t) { return "<option" + (t === typeF ? " selected" : "") + ">" + esc(t) + "</option>"; }).join("") + "</select></div></div>" +
        '<div id="rs-list"></div>';
      var draw = function () {
        var s = q.toLowerCase();
        var rows = list.filter(function (a) {
          return (!typeF || a.act_type === typeF) && (!s || [a.name, a.style, a.based, a.contact_name, a.act_type].join(" ").toLowerCase().indexOf(s) > -1);
        });
        document.getElementById("rs-list").innerHTML = rows.length ? '<div class="list">' + rows.map(function (a) {
          var ch = channels(a);
          var bits = [a.act_type, a.style, a.based, a.fee_guide].filter(Boolean).join(" · ");
          return '<a class="row" href="#r=' + a.id + '"><div><div class="t">' + esc(a.name) + (a.active ? "" : ' <span class="small">(not active)</span>') + '</div><div class="s">' + esc(bits || "No details yet") + "</div></div>" +
            '<span class="pill ' + (ch.length ? "ready" : "draft") + '">' + esc(ch.length ? ch.join(" + ") : "No contact") + "</span></a>";
        }).join("") + "</div>" : '<div class="empty">' + (list.length ? "No acts match." : "Nobody on our talent list yet. Use “Add talent” to add the acts you already book.") + "</div>";
      };
      draw();
      document.getElementById("rs-q").oninput = function (e) { q = e.target.value; draw(); };
      document.getElementById("rs-t").onchange = function (e) { typeF = e.target.value; draw(); };
    }

    async function viewAct(id, prefill) {
      stopLive();
      var a;
      if (id === "new") a = Object.assign({ id: null, name: "", act_type: "DJ", style: "", contact_name: "", email: "", phone: "", notify_email: true, notify_whatsapp: false,
        based: "", fee_guide: "", website: "", instagram: "", tiktok: "", facebook: "", mixcloud: "", notes: "", active: true }, prefill || {});
      else {
        var r = await sb.from("tm_roster").select("*").eq("id", id).maybeSingle();
        if (r.error || !r.data) { app.innerHTML = TB.nav("roster") + '<a class="back" href="#roster">← Our talent</a><p class="err">' + esc(r.error ? errMsg(r.error) : "This act isn’t on our talent list any more.") + "</p>"; return; }
        a = r.data;
      }
      function inp(k, label, type, ph, extra) { return '<div><label for="r-' + k + '">' + label + '</label><input type="' + (type || "text") + '" id="r-' + k + '" data-r="' + k + '" value="' + esc(a[k]) + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : "") + (extra || "") + "></div>"; }
      var bookings = [];
      if (a.id) { var b = await sb.from("tm_bookings").select("id,ref,event_name,event_date,venue_name,status,no_response_flagged_at").eq("roster_id", a.id).order("event_date", { ascending: false }); bookings = b.data || []; }
      app.innerHTML = TB.nav("roster") + '<a class="back" href="#roster">← Our talent</a>' +
        '<div class="sechead" style="margin-top:8px"><h2 class="display">' + esc(a.name || "Add talent") + "</h2></div>" +
        '<form class="f" id="r-form" novalidate>' +
        '<div class="panel f">' + inp("name", "Act or artist name") +
          '<div class="two"><div><label for="r-act_type">Type of act</label><select id="r-act_type" data-r="act_type">' + TYPES.map(function (t) { return "<option" + (a.act_type === t ? " selected" : "") + ">" + esc(t) + "</option>"; }).join("") + "</select></div>" +
          inp("style", "Style or genre", "text", "e.g. House, disco, Motown") + "</div>" +
          '<div class="two">' + inp("based", "Based", "text", "e.g. North London") + inp("fee_guide", "Usual fee", "text", "e.g. £400 for 3 hours") + "</div></div>" +
        '<div class="sechead"><h2 class="display" style="font-size:26px">Contact and notifications</h2></div><div class="panel f">' +
          inp("contact_name", "Contact name", "text", "The artist or their agent") +
          '<div class="two">' + inp("email", "Email", "email", "name@example.com") + inp("phone", "WhatsApp number", "tel", "+44 7…", ' inputmode="tel"') + "</div>" +
          '<div><span class="lab">Send booking requests and reminders by</span>' +
          '<label class="check" style="margin:6px 0"><input type="checkbox" data-r="notify_email"' + (a.notify_email ? " checked" : "") + "><span>Email (sent automatically, including chasers and reminders before the event)</span></label>" +
          '<label class="check" style="margin:6px 0"><input type="checkbox" data-r="notify_whatsapp"' + (a.notify_whatsapp ? " checked" : "") + "><span>WhatsApp (opens WhatsApp with the message written; you press send)</span></label></div></div>" +
        '<div class="sechead"><h2 class="display" style="font-size:26px">Links and notes</h2></div><div class="panel f">' +
          inp("website", "Website", "url", "https://") +
          '<div class="two">' + inp("instagram", "Instagram", "url", "https://") + inp("tiktok", "TikTok", "url", "https://") + "</div>" +
          '<div class="two">' + inp("facebook", "Facebook", "url", "https://") + inp("mixcloud", "Mixcloud", "url", "https://") + "</div>" +
          '<div><label for="r-notes">Notes for the team</label><textarea id="r-notes" data-r="notes" placeholder="Rider, how they like to be booked, past gigs">' + esc(a.notes) + "</textarea></div>" +
          '<label class="check" style="margin:0"><input type="checkbox" data-r="active"' + (a.active ? " checked" : "") + "><span>Active (show in “From our list” when adding talent to a gig)</span></label></div>" +
        '<div id="r-msg"></div>' +
        '<div style="display:grid;gap:10px"><button type="submit" class="btn block">' + (a.id ? "Save" : "Add to our talent") + "</button>" +
          (a.id && me.admin ? '<button type="button" class="btn ghost block" id="r-book">Book this act</button>' : "") + "</div></form>" +
        (bookings.length ? '<div class="sechead"><h2 class="display" style="font-size:26px">Bookings</h2></div><div class="list">' + bookings.map(function (k) {
          return '<a class="row" href="#k=' + k.id + '"><div><div class="t">' + esc(k.event_name || "Booking") + '</div><div class="s">' + esc([fmtDate(k.event_date), k.venue_name, k.ref].filter(Boolean).join(" · ")) + '</div></div><span class="pill ' + k.status + '">' + esc(TB.label(k)) + "</span></a>";
        }).join("") + "</div>" : "") +
        (a.id ? '<div style="margin-top:28px"><button type="button" class="linkbtn danger" id="r-del">Remove from our talent</button></div>' : "") +
        '<p class="disclaimer">Contact details are for booking this act only, never for marketing. Removing an act keeps its past bookings.</p>';

      var form = document.getElementById("r-form");
      form.querySelectorAll("[data-r]").forEach(function (i) {
        i[i.type === "checkbox" || i.tagName === "SELECT" ? "onchange" : "oninput"] = function () { a[i.dataset.r] = i.type === "checkbox" ? i.checked : i.value; };
      });
      var ph = document.getElementById("r-phone");
      ph.onblur = function () { var p = phone(ph.value); if (p) { ph.value = p; a.phone = p; } };
      form.onsubmit = async function (ev) {
        ev.preventDefault();
        var msg = document.getElementById("r-msg");
        var p = a.phone ? phone(a.phone) : "";
        var probs = [];
        if (!String(a.name).trim()) probs.push("Enter the act’s name.");
        if (a.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(a.email.trim())) probs.push("Check the email address.");
        if (a.phone && !p) probs.push("Check the WhatsApp number. Use a UK mobile (07…) or include the country code (+…).");
        if (a.notify_email && !a.email) probs.push("Add an email, or untick Email.");
        if (a.notify_whatsapp && !a.phone) probs.push("Add a WhatsApp number, or untick WhatsApp.");
        var bad = ["website", "instagram", "tiktok", "facebook", "mixcloud"].filter(function (k) { return a[k] && !safeUrl(a[k]); });
        if (bad.length) probs.push("Links must start with https:// (check " + bad.join(", ") + ").");
        if (probs.length) { msg.innerHTML = '<p class="err">' + probs.map(esc).join("<br>") + "</p>"; return; }
        var row = { name: a.name.trim(), act_type: a.act_type, style: a.style, contact_name: a.contact_name, email: (a.email || "").trim().toLowerCase(), phone: p,
          notify_email: !!a.notify_email, notify_whatsapp: !!a.notify_whatsapp, based: a.based, fee_guide: a.fee_guide, website: a.website, instagram: a.instagram,
          tiktok: a.tiktok, facebook: a.facebook, mixcloud: a.mixcloud, notes: a.notes, active: !!a.active };
        var r = a.id ? await sb.from("tm_roster").update(row).eq("id", a.id).select().single() : await sb.from("tm_roster").insert(row).select().single();
        if (r.error) {
          msg.innerHTML = '<p class="err">' + esc(/duplicate|unique/i.test(r.error.message) ? "There’s already an act called “" + row.name + "” on our talent list." : errMsg(r.error)) + "</p>"; return;
        }
        if (a.fromCandidate) await sb.from("tm_candidates").update({ roster_id: r.data.id }).eq("id", a.fromCandidate);
        if (a.back) { location.hash = a.back; return; }
        if (!a.id) { location.hash = "#r=" + r.data.id; return; }
        msg.innerHTML = '<p class="okmsg">Saved.</p>';
      };
      var bk = document.getElementById("r-book");
      if (bk) bk.onclick = function () {
        TB.create({ roster_id: a.id, artist_name: a.name, artist_contact: a.contact_name, artist_email: a.email, artist_phone: a.phone, act_label: a.act_type }, bk);
      };
      var del = document.getElementById("r-del");
      if (del) del.onclick = async function () {
        if (del.dataset.armed !== "1") { del.dataset.armed = "1"; del.textContent = "Tap again to remove " + a.name; return; }
        var r = await sb.from("tm_roster").delete().eq("id", a.id);
        if (r.error) { del.textContent = "Couldn’t remove: " + errMsg(r.error); return; }
        location.hash = "#roster";
      };
    }

    function fromCandidate(x) {
      var em = String(x.booking || "").match(/[^\s@,;()]+@[^\s@,;()]+\.[a-z]{2,}/i);
      var ph = phone((String(x.booking || "").match(/(\+?\d[\d\s]{9,14}\d)/) || [])[1]);
      var act = ((state.brief || {}).acts || []).find(function (a) { return a.id === x.act_id; }) || {};
      sessionStorage.setItem("tm-roster-prefill", JSON.stringify({ name: x.name, act_type: act.type || "DJ", style: act.style || "", email: em ? em[0].toLowerCase() : "", phone: ph,
        notify_email: !!em, notify_whatsapp: !!ph, based: x.based, website: x.website, instagram: x.instagram, tiktok: x.tiktok, facebook: x.facebook, mixcloud: x.mixcloud,
        notes: x.notes || "", fromCandidate: x.id, back: "#b=" + x.brief_id }));
      location.hash = "#r=new";
    }
    function takePrefill() {
      try { var p = sessionStorage.getItem("tm-roster-prefill"); sessionStorage.removeItem("tm-roster-prefill"); return p ? JSON.parse(p) : null; } catch (e) { return null; }
    }

    return { load: load, viewRoster: viewRoster, viewAct: viewAct, fromCandidate: fromCandidate, takePrefill: takePrefill, channels: channels };
  })();

  /* ---------- Routing and sign-in ---------- */
  function route() {
    var m = location.hash.match(/^#b=([0-9a-f-]{36})$/);
    var k = location.hash.match(/^#k=([0-9a-f-]{36})$/);
    if (m) viewBrief(m[1]);
    else if (k) TB.viewBooking(k[1]);
    else if (/^#bookings/.test(location.hash)) TB.viewBookings();
    else if (/^#venues/.test(location.hash)) VN.viewVenues();
    else if (/^#v=[0-9a-f-]{36}$/.test(location.hash)) VN.viewVenue(location.hash.slice(3));
    else if (/^#roster/.test(location.hash)) RS.viewRoster();
    else if (/^#r=new$/.test(location.hash)) RS.viewAct("new", RS.takePrefill());
    else if (/^#r=[0-9a-f-]{36}$/.test(location.hash)) RS.viewAct(location.hash.slice(3));
    else viewList();
  }

  (async function start() {
    var s = await sb.auth.getSession();
    var user = s.data && s.data.session && s.data.session.user;
    if (!user) return;
    me.email = (user.email || "").toLowerCase();
    var st = await sb.rpc("tm_is_staff");
    var ad = await sb.rpc("hub_is_admin");
    me.admin = ad.data === true;
    document.getElementById("who").innerHTML = "Signed in as <strong>" + esc(me.email) + "</strong>";
    if (st.error || st.data !== true) {
      app.innerHTML = '<div class="empty"><strong>Staff only.</strong><br>This tool is for Fort Green staff. Sign in with your @fortgreen.co.uk email to use it.</div>';
      return;
    }
    window.addEventListener("hashchange", route);
    route();
  })();
})();
</script>
</body>
</html>
