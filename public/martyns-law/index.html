<!DOCTYPE html>
<html lang="en-GB">
<head>
<style id="fg-guard">html{visibility:hidden}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/auth-guard.js"></script>
<script src="/lead.js"></script>
<script src="/results.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Martyn’s Law readiness check | Fort Green</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfbfb; --surface:#ffffff; --surface-2:#eeeeee; --ink:#000000; --muted:#5f5f5f;
  --line:#cecece; --accent:#000000; --accent-ink:#ffffff; --accent-soft:#e8e8e8;
  --yellow:#e0a800; --yellow-ink:#000000; --green:#1f9d55; --green-ink:#ffffff; --amber:#4a4a4a; --amber-soft:#e3e3e3; --red:#b42318; --red-soft:#fbe4e1; --zone-out:#ffffff; --zone-std:#cecece;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --yellow:#f5c518; --yellow-ink:#000000; --green:#22c55e; --green-ink:#000000; --bg:#100f10; --surface:#1a191a; --surface-2:#262526; --ink:#ffffff; --muted:#a9a9a9;
    --line:#3b3a3b; --accent:#ffffff; --accent-ink:#000000; --accent-soft:#2e2d2e;
    --amber:#cecece; --amber-soft:#333233; --red:#ff7b6e; --red-soft:#2d1513; --zone-out:#1a191a; --zone-std:#4a494a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --yellow:#f5c518; --yellow-ink:#000000; --green:#22c55e; --green-ink:#000000; --bg:#100f10; --surface:#1a191a; --surface-2:#262526; --ink:#ffffff; --muted:#a9a9a9;
    --line:#3b3a3b; --accent:#ffffff; --accent-ink:#000000; --accent-soft:#2e2d2e;
    --amber:#cecece; --amber-soft:#333233; --red:#ff7b6e; --red-soft:#2d1513; --zone-out:#1a191a; --zone-std:#4a494a;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top, 0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 18px}
.brand{display:flex;align-items:center;font-family:"Antonio","Arial Narrow",sans-serif;font-weight:700;font-size:26px;line-height:1;letter-spacing:.01em;text-transform:uppercase;color:var(--ink);text-decoration:none}

.tool-name{font-size:14px;color:var(--muted);font-weight:500}

main{max-width:560px;margin:0 auto;padding:20px 18px 120px}
.screen{display:none}
.screen.on{display:block}

h1{font-family:"Antonio","Arial Narrow",sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(46px,13vw,72px);line-height:.9;letter-spacing:-.01em;margin:8px 0 16px}
h2{font-family:"Antonio","Arial Narrow",sans-serif;font-weight:600;text-transform:uppercase;font-size:28px;line-height:1.1;margin:0 0 6px}
h3{font-family:"Antonio","Arial Narrow",sans-serif;font-weight:600;font-size:22px;line-height:1.15;margin:0 0 4px}
p{margin:0 0 12px}
.lede{font-size:18px;color:var(--muted);max-width:34em}
.muted{color:var(--muted)}
.small{font-size:14px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:0;padding:18px;margin:16px 0}
.status{display:flex;gap:10px;align-items:flex-start;border-left:4px solid var(--accent);padding:10px 14px;background:var(--surface);border-radius:0;margin:18px 0}
.status strong{display:block}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:0;border:0;cursor:pointer;font-family:"Manrope",system-ui,sans-serif;font-weight:600;font-size:16px;letter-spacing:.01em;text-decoration:none}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:grid;gap:10px;margin-top:18px}
.link-btn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Capacity scale - signature element */
.scale{margin:18px 0 6px}
.scale-track{position:relative;display:grid;grid-template-columns:20fr 60fr 20fr;height:46px;overflow:visible}
.zone{display:flex;align-items:center;padding:0 10px;font-family:"Antonio","Arial Narrow",sans-serif;font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden}
.z-out{background:var(--zone-out);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.z-std{background:var(--zone-std);color:var(--ink)}
.z-enh{background:var(--accent);color:var(--accent-ink)}
.scale-ticks{position:relative;height:22px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.scale-ticks span{position:absolute;top:4px;transform:translateX(-50%)}
.marker{position:absolute;top:-10px;bottom:-10px;width:0;transition:left .35s ease}
.marker::before{content:"";position:absolute;left:-1.5px;top:0;bottom:0;width:3px;background:var(--ink);border-radius:2px}
.marker::after{content:attr(data-label);position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:1px 7px;border-radius:0;white-space:nowrap}
.scale.has-marker{margin-top:38px}

/* Forms */
.field{margin:0 0 18px}
.field label,.field .label{display:block;font-weight:600;margin-bottom:6px}
.hint{font-size:14px;color:var(--muted);margin-top:6px}
input[type=text],input[type=email],input[type=number],select{width:100%;min-height:50px;padding:10px 14px;border-radius:0;border:1.5px solid var(--line);background:var(--surface);font-size:17px}
input:focus,select:focus{border-color:var(--accent);outline:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);padding:4px;border-radius:0}
.seg button{min-height:44px;border:0;border-radius:0;background:transparent;cursor:pointer;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.check{display:flex;gap:12px;align-items:flex-start;margin:12px 0;font-size:15px}
.check input{width:22px;height:22px;margin-top:1px;accent-color:var(--accent);flex:none}

/* Verdict */
.verdict{border-radius:0;padding:18px;margin:18px 0;border:1.5px solid var(--line);background:var(--surface)}
.verdict.v-standard{border-color:var(--accent)}
.verdict.v-enhanced{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.verdict.v-enhanced .muted{color:inherit;opacity:.8}
.verdict.v-check{border-color:var(--ink);border-style:dashed}
.verdict h2{margin-bottom:4px}

/* Questions */
.progress{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 53px);z-index:5;background:var(--bg);padding:10px 0 12px}
.bar{height:6px;background:var(--surface-2);border-radius:0;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s ease}
.q{padding:16px 0;border-bottom:1px solid var(--line)}
.q:last-of-type{border-bottom:0}
.q-group{font-family:"Antonio","Arial Narrow",sans-serif;font-weight:600;text-transform:uppercase;font-size:24px;margin:22px 0 2px;padding-top:6px}
.q p{margin:2px 0 10px;font-size:14px;color:var(--muted)}
.q .seg button[data-v="done"][aria-pressed="true"]{background:var(--green);color:var(--green-ink)}
.q .seg button[data-v="progress"][aria-pressed="true"]{background:var(--yellow);color:var(--yellow-ink)}
.q .seg button[data-v="none"][aria-pressed="true"]{background:var(--red-soft);color:var(--red)}

/* Report */
.report-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.score-wrap{display:flex;align-items:center;gap:18px}
.ring{width:112px;height:112px;flex:none}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--accent);stroke-linecap:butt;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .6s ease}
.ring text{fill:var(--ink);font-family:"Antonio","Arial Narrow",sans-serif;font-weight:700;font-size:30px;text-anchor:middle;dominant-baseline:central}
.tally{list-style:none;padding:0;margin:0;font-size:15px}
.tally li{display:flex;align-items:center;gap:8px;margin:3px 0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.gap{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.gap:last-child{border-bottom:0}
.gap .pill{grid-row:span 2;align-self:start;font-size:12px;font-weight:600;padding:3px 8px;border-radius:0;white-space:nowrap;margin-top:2px}
.pill-none{background:var(--red-soft);color:var(--red)}
.pill-progress{background:var(--yellow);color:var(--yellow-ink)}
.gap strong{display:block;line-height:1.3}
.gap .help{font-size:14px;color:var(--muted)}
.gap .help b{color:var(--accent);font-weight:600}
.locked{border:1.5px dashed var(--line);border-radius:0;padding:20px;margin:18px 0;text-align:left}
.duty{margin:0 0 14px}
.duty strong{display:block}
.disclaimer{font-size:13px;color:var(--muted);margin-top:24px;border-top:1px solid var(--line);padding-top:14px}
.empty{padding:40px 0;text-align:left}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom, 0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;background:none;border:0;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--accent);border-radius:0}
.badge{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center}

/* Bottom sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--surface);border-radius:0;padding:10px 20px calc(20px + env(safe-area-inset-bottom, 0px));max-height:90vh;overflow-y:auto;transform:translateY(105%);transition:transform .28s ease}
.sheet.on{transform:none}
.grabber{width:42px;height:5px;border-radius:0;background:var(--line);margin:4px auto 14px}
.error{color:var(--red);font-size:14px;margin-top:6px}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* Printable report (A4) */
#print-doc{display:none}
@page{size:A4;margin:14mm}
@media print{
  html,body{background:#fff!important;color:#000}
  body::before{display:none}
  body > *:not(#print-doc){display:none!important}
  #print-doc{display:block;font-family:"Manrope",Arial,sans-serif;font-size:10.5pt;line-height:1.45;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.pd-head{display:flex;justify-content:space-between;align-items:center;background:#000;color:#fff;padding:12px 16px}
.pd-brand{font-family:"Antonio","Arial Narrow",sans-serif;font-weight:700;font-size:22pt;letter-spacing:.02em;line-height:1}
.pd-doc{font-family:"Antonio","Arial Narrow",sans-serif;font-size:11pt;text-transform:uppercase;letter-spacing:.06em;text-align:right;line-height:1.3}
.pd-title{font-family:"Antonio","Arial Narrow",sans-serif;font-weight:700;text-transform:uppercase;font-size:30pt;line-height:1;margin:18px 0 6px}
.pd-meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:9.5pt;color:#444;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #cecece}
.pd-meta b{color:#000;font-weight:600}
.pd-cards{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;margin-bottom:12px}
.pd-card{border:1.5px solid #000;padding:12px 14px}
.pd-card.dark{background:#000;color:#fff}
.pd-label{font-size:8pt;text-transform:uppercase;letter-spacing:.08em;color:inherit;opacity:.7;margin-bottom:4px}
.pd-tier{font-family:"Antonio","Arial Narrow",sans-serif;font-weight:700;text-transform:uppercase;font-size:18pt;line-height:1.05;margin-bottom:6px}
.pd-score{display:flex;align-items:baseline;gap:4px;font-family:"Antonio","Arial Narrow",sans-serif;font-weight:700;line-height:1}
.pd-score span{font-size:36pt}
.pd-score small{font-size:13pt;opacity:.7}
.pd-tally{list-style:none;padding:0;margin:8px 0 0;font-size:9.5pt}
.pd-tally li{display:flex;align-items:center;gap:6px;margin:2px 0}
.pd-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.pd-bar{display:grid;grid-template-columns:20fr 60fr 20fr;height:18px;position:relative;margin:4px 0 2px;font-size:7.5pt;font-family:"Antonio","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.04em}
.pd-bar div{display:flex;align-items:center;padding:0 6px}
.pd-bar .o{border:1px solid #cecece;color:#5f5f5f}.pd-bar .s{background:#cecece}.pd-bar .e{background:#000;color:#fff}
.pd-bar i{position:absolute;top:-4px;bottom:-4px;width:2.5px;background:#e0a800;margin-left:-1px}
.pd-ticks{position:relative;height:14px;font-size:7.5pt;color:#5f5f5f}
.pd-ticks span{position:absolute;transform:translateX(-50%)}
.pd-h2{font-family:"Antonio","Arial Narrow",sans-serif;font-weight:700;text-transform:uppercase;font-size:14pt;margin:20px 0 8px;padding-bottom:4px;border-bottom:2px solid #000;break-after:avoid}
.pd-table{width:100%;border-collapse:collapse;font-size:9.5pt}
.pd-table th{text-align:left;font-size:7.5pt;text-transform:uppercase;letter-spacing:.06em;color:#5f5f5f;font-weight:600;padding:0 8px 6px 0;border-bottom:1px solid #cecece}
.pd-table td{vertical-align:top;padding:8px 8px 8px 0;border-bottom:1px solid #e3e3e3}
.pd-table tr{break-inside:avoid}
.pd-num{font-family:"Antonio","Arial Narrow",sans-serif;font-weight:700;font-size:12pt;width:22px}
.pd-pill{display:inline-block;font-size:7.5pt;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;white-space:nowrap}
.pd-pill.none{background:#fbe4e1;color:#b42318}.pd-pill.progress{background:#e0a800;color:#000}.pd-pill.done{background:#1f9d55;color:#fff}
.pd-why{color:#5f5f5f;font-size:9pt}
.pd-two{display:grid;grid-template-columns:1fr 1fr;gap:16px;break-inside:avoid}
.pd-duty{margin:0 0 8px;break-inside:avoid}.pd-duty b{display:block}
.pd-dates{list-style:none;padding:0;margin:0}
.pd-dates li{display:grid;grid-template-columns:78px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid #e3e3e3;font-size:9.5pt}
.pd-dates b{font-family:"Antonio","Arial Narrow",sans-serif;font-size:10.5pt}
.pd-cta{background:#000;color:#fff;padding:14px 16px;margin-top:18px;display:grid;grid-template-columns:1.3fr 1fr;gap:16px;break-inside:avoid}
.pd-cta h3{font-family:"Antonio","Arial Narrow",sans-serif;text-transform:uppercase;font-size:15pt;margin:0 0 4px}
.pd-cta p{margin:0;font-size:9.5pt;opacity:.85}
.pd-contact{font-size:10pt;line-height:1.7}.pd-contact b{display:inline-block;width:72px;font-weight:600;opacity:.7}
.pd-foot{margin-top:14px;font-size:7.5pt;color:#5f5f5f;border-top:1px solid #cecece;padding-top:6px;display:flex;justify-content:space-between;gap:16px;break-inside:avoid}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="https://www.fortgreen.co.uk" target="_blank" rel="noopener">Fort Green</a>
    <div class="tool-name">Martyn’s Law check</div>
  </div>
</header>

<main id="main">
  <section class="screen" id="screen-start" aria-labelledby="h-start"></section>
  <section class="screen" id="screen-scope" aria-labelledby="h-scope"></section>
  <section class="screen" id="screen-ready" aria-labelledby="h-ready"></section>
  <section class="screen" id="screen-report" aria-labelledby="h-report"></section>
</main>

<nav class="nav" aria-label="Sections">
  <div class="nav-in">
    <button data-tab="start"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button data-tab="scope"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/><path d="M2 12h3M19 12h3"/></svg>Scope</button>
    <button data-tab="ready"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.3 1.3L7 5M3.5 12l1.3 1.3L7 11M3.5 18l1.3 1.3L7 17"/></svg>Readiness<span class="badge" id="badge" hidden></span></button>
    <button data-tab="report"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>Report</button>
  </div>
</nav>

<div id="print-doc" aria-hidden="true"></div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="h-sheet">
  <div class="grabber"></div>
  <h2 id="h-sheet">Get your full report</h2>
  <p class="muted">We’ll show your full gap list now and email you a copy.</p>
  <form id="lead-form" novalidate>
    <div class="field"><label for="f-name">Your name</label><input type="text" id="f-name" autocomplete="name"></div>
    <div class="field"><label for="f-email">Email</label><input type="email" id="f-email" autocomplete="email" inputmode="email"><div class="error" id="f-email-err" hidden></div></div>
    <div class="field"><label for="f-org">Organisation</label><input type="text" id="f-org" autocomplete="organization"></div>
    <div class="field"><label for="f-phone">Phone (optional)</label><input type="tel" id="f-phone" autocomplete="tel" inputmode="tel"></div>
    <label class="check"><input type="checkbox" id="f-mkt"><span>Send me Martyn’s Law updates and occasional news from Fort Green. You can unsubscribe at any time.</span></label>
    <p class="small muted">We use your details to send this report and follow up about it. See our privacy notice on fortgreen.co.uk.</p>
    <div class="btn-row">
      <button type="submit" class="btn btn-primary btn-block">Show my full report</button>
      <button type="button" class="btn btn-ghost btn-block" id="sheet-close">Cancel</button>
    </div>
  </form>
</div>

<script>
/* ---------- Config ----------
   LEAD_ENDPOINT: set to the n8n webhook URL when this runs on fortgreen.co.uk.
   The report unlocks on the device either way; n8n logs the lead and emails the report. */
const LEAD_ENDPOINT = "https://sierra-six.app.n8n.cloud/webhook/martyns-law-lead";
/* REVIEW_ENDPOINT: n8n webhook that emails the team when someone books a readiness review. */
const REVIEW_ENDPOINT = "https://sierra-six.app.n8n.cloud/webhook/martyns-law-review";
const CONTACT_EMAIL = "info@fortgreen.co.uk";
const STORE_KEY = "fg-martyns-law-v1";

const USES = [
  ["bar","Bar, pub or nightclub"],
  ["food","Restaurant or café"],
  ["ent","Music venue, theatre or cinema"],
  ["sport","Sports ground or stadium"],
  ["attraction","Museum, gallery or visitor attraction"],
  ["hotel","Hotel or conference venue"],
  ["retail","Shop or shopping centre"],
  ["worship","Place of worship"],
  ["education","School, college, university or childcare"],
  ["other","Something else or not sure"]
];

const QUESTIONS = [
  {id:"notify", tier:"standard", group:"Standard duties",
   q:"We know who the responsible person is and are ready to notify the SIA",
   why:"Every premises or event in scope must be notified to the Security Industry Authority.",
   help:"We can handle the notification paperwork with you."},

/* ---------- Tier logic ---------- */
function getTier(){
  const cap = parseInt(state.capacity,10);
  if(!cap || cap < 1) return {key:"incomplete"};
  if(state.mode === "event"){
    if(state.controlled === null) return {key:"incomplete"};
    if(cap < 800) return {key:"out", title:"Likely out of scope as an event",
      body:"Only public events of 800 or more with controlled entry count as qualifying events. If the event is held at premises that are in scope, those premises’ duties still apply."};
    if(!state.controlled) return {key:"check", title:"Check the guidance",
      body:"Events without any entry checks may fall outside the definition of a qualifying event. Confirm against the statutory guidance before relying on this."};
    return {key:"enhanced", title:"Likely enhanced tier",
      body:"A public event of 800+ with controlled entry is treated like an enhanced tier premises."};
  }
  if(!state.use) return {key:"incomplete"};
  if(cap < 200) return {key:"out", title:"Likely out of scope",
    body:"Premises with a capacity under 200 aren’t covered by the Act, though good security practice still applies."};
  if(state.use === "other") return {key:"check", title:"Check the guidance",
    body:"Only premises used for the purposes listed in the Act are in scope. Check whether your use is listed in the statutory guidance."};
  if(cap < 800) return {key:"standard", title:"Likely standard tier",
    body:"Capacity of 200 to 799 means standard duties: notify the SIA and have public protection procedures."};
  if(state.use === "worship" || state.use === "education") return {key:"standard", title:"Likely standard tier",
    body:"Places of worship and education or childcare premises stay in the standard tier even at 800+."};
  return {key:"enhanced", title:"Likely enhanced tier",
    body:"Capacity of 800+ means standard duties plus public protection measures, a documented security plan and a senior individual."};
}
function activeQuestions(t){
  if(t.key === "standard" || t.key === "check") return QUESTIONS.filter(q => q.tier === "standard");
  if(t.key === "enhanced") return QUESTIONS;
  return [];
}
function results(){
  const t = getTier(), qs = activeQuestions(t);
  let done=0, prog=0, none=0, unanswered=0;
  qs.forEach(q => { const a = state.answers[q.id];
    if(a==="done") done++; else if(a==="progress") prog++; else if(a==="none") none++; else unanswered++; });
  const score = qs.length ? Math.round((done + prog*0.5) / qs.length * 100) : null;
  return {t, qs, done, prog, none, unanswered, score};
}

/* ---------- Capacity scale ---------- */
function scaleHTML(withMarker){
  const cap = parseInt(state.capacity,10);
  const ev = state.mode === "event";
  let marker = "";
  if(withMarker && cap > 0){
    const pos = Math.min(cap, 1000) / 1000 * 100;
    const label = cap >= 1000 ? cap.toLocaleString("en-GB") + " →" : cap.toLocaleString("en-GB");
    marker = `<div class="marker" style="left:${pos}%" data-label="${label}"></div>`;
  }
  return `<div class="scale ${marker ? "has-marker":""}" aria-hidden="true">
    <div class="scale-track">
      <div class="zone z-out">Out</div>
      <div class="zone ${ev ? "z-out" : "z-std"}">${ev ? "Out of scope for events" : "Standard tier"}</div>
      <div class="zone z-enh">Enhanced</div>
      ${marker}
    </div>
    <div class="scale-ticks"><span style="left:20%">200</span><span style="left:80%">800</span></div>
  </div>`;
}
function verdictHTML(t){
  if(t.key === "incomplete") return `<div class="verdict"><p class="muted" style="margin:0">Fill in the details above to see your result.</p></div>`;
  return `<div class="verdict v-${t.key}" role="status"><h2>${t.title}</h2><p class="muted" style="margin:0">${t.body}</p></div>`;
}

function ringHTML(score){

    <text x="56" y="56">${score}</text></svg>`;
}

        <div class="pd-tier">${r.t.title}</div>
        <div style="font-size:9.5pt;color:#444;margin-bottom:10px">${r.t.body}</div>
        <div class="pd-bar"><div class="o">Out</div><div class="${state.mode==="event"?"o":"s"}">${state.mode==="event"?"Out of scope for events":"Standard"}</div><div class="e">Enhanced</div>${cap ? `<i style="left:${pos}%"></i>` : ""}</div>
        <div class="pd-ticks"><span style="left:20%">200</span><span style="left:80%">800</span></div>
      </div>
      ${r.score !== null ? `
      <div class="pd-card dark">
        <div class="pd-label">Readiness score</div>
        <div class="pd-score"><span>${r.score}</span><small>/100</small></div>
        <ul class="pd-tally">
          <li><span class="pd-dot" style="background:#22c55e"></span>${r.done} done</li>
          <li><span class="pd-dot" style="background:#f5c518"></span>${r.prog} in progress</li>
          <li><span class="pd-dot" style="background:#ff7b6e"></span>${r.none} not started</li>
        </ul>
      </div>` : `<div class="pd-card"><div class="pd-label">Readiness</div><p style="margin:0;font-size:9.5pt">Based on your answers, the Act likely doesn’t apply, so there are no duties to score.</p></div>`}
    </div>

    ${rows.length ? `
    <div class="pd-h2">Your action plan</div>
    <table class="pd-table">
      <thead><tr><th>#</th><th>Duty</th><th>Status</th><th>${branded ? "How Fort Green can help" : "Next step"}</th></tr></thead>
      <tbody>${rows.map((q,i) => { const a = state.answers[q.id] || "none"; return `
        <tr><td class="pd-num">${i+1}</td>
          <td><b>${q.q}</b><div class="pd-why">${q.why}</div></td>
          <td><span class="pd-pill ${a}">${label[a]}</span></td>
          <td>${a === "done" ? `<span class="pd-why">Keep under review and brief new staff.</span>` : (branded ? q.help : NEXT_STEPS[q.id])}</td></tr>`; }).join("")}
      </tbody>
    </table>` : `
    <div class="pd-h2">Good practice still counts</div>
    <p>Even if the Act doesn’t apply, a simple evacuation and lockdown plan and briefed staff protect your guests and your licence.${branded ? " Fort Green can help with both." : ""}</p>`}

    <div class="pd-two">
      ${rows.length ? `<div><div class="pd-h2">Your duties in plain English</div>
        ${duties.map(([h,d]) => `<div class="pd-duty"><b>${h}</b><span class="pd-why">${d}</span></div>`).join("")}</div>` : `<div></div>`}
      <div><div class="pd-h2">Key dates</div>
        <ul class="pd-dates">
          <li><b>Apr 2025</b><span>Terrorism (Protection of Premises) Act receives Royal Assent</span></li>
          <li><b>Apr 2026</b><span>Home Office publishes final statutory guidance</span></li>
          <li><b>Now</b><span>SIA guidance in draft; prepare procedures and brief staff</span></li>
          <li><b>Spring 2027</b><span>Expected to come into force, likely April; exact date to be set by Parliament</span></li>
        </ul></div>
    </div>

    ${branded ? `<div class="pd-cta">
      <div><h3>Book a readiness review</h3><p>We’ll walk your site, close the gaps with you and prepare your team before the law comes into force.</p></div>
      <div class="pd-contact"><div><b>Email</b> ${CONTACT_EMAIL}</div><div><b>WhatsApp</b> +44 7399 232855 (24/7)</div><div><b>Web</b> fortgreen.co.uk</div></div>
    </div>` : ""}

    <div class="pd-foot"><span>This report was produced with the Fort Green Martyn’s Law readiness check (fortgreen.co.uk). It gives a general indication only and isn’t legal advice. Confirm your position against the Home Office’s final statutory guidance and the SIA’s guidance, which may change before the law comes into force. Fort Green is not endorsed by the Home Office or the SIA.</span></div>`;
}
window.addEventListener("beforeprint", () => { if(state.unlocked) renderPrintDoc(); });

/* ---------- Readiness review request ---------- */
async function bookReview(r, gaps, btn){
  const err = $("#book-err");
  if(!state.lead || !state.lead.email){ openSheet(); return; }
  btn.disabled = true; btn.textContent = "Sending…"; err.hidden = true;
  const payload = Object.assign({}, state.lead, {
    venue:state.name, mode:state.mode, capacity:state.capacity, use:state.use,
    tier:r.t.title, score:r.score,
    gaps:gaps.map(q => (state.answers[q.id]==="none" ? "Not started: " : "In progress: ") + q.q),
    submitted_at:new Date().toISOString()
  });
  try{
    const res = await FGLead.post(REVIEW_ENDPOINT, payload);
    if(!res.ok) throw new Error(res.status);
    state.reviewRequested = true; save(); renderReport();
  }catch(x){
    btn.disabled = false; btn.textContent = "Book a readiness review";
    err.innerHTML = `We couldn’t send that just now. Message us on <a href="https://wa.me/447399232855" target="_blank" rel="noopener">WhatsApp</a> or email <a href="mailto:${CONTACT_EMAIL}">${CONTACT_EMAIL}</a>.`;
    err.hidden = false;
  }
}

/* ---------- Lead sheet ---------- */
function openSheet(){ $("#overlay").classList.add("on"); $("#sheet").classList.add("on"); setTimeout(() => $("#f-name").focus(), 250); }
function closeSheet(){ $("#overlay").classList.remove("on"); $("#sheet").classList.remove("on"); }
$("#overlay").onclick = closeSheet;
$("#sheet-close").onclick = closeSheet;
document.addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });
$("#lead-form").onsubmit = async e => {
  e.preventDefault();
  const email = $("#f-email").value.trim(), err = $("#f-email-err");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ err.textContent = "Enter a valid email address, like name@venue.co.uk."; err.hidden = false; $("#f-email").focus(); return; }
  err.hidden = true;
  const r = results();
  const lead = { name:$("#f-name").value.trim(), email, organisation:$("#f-org").value.trim(), phone:$("#f-phone").value.trim(),
    marketing_opt_in:$("#f-mkt").checked, venue:state.name, mode:state.mode, capacity:state.capacity,
    use:state.use, tier:r.t.key, score:r.score, answers:state.answers, submitted_at:new Date().toISOString() };
  const submitBtn = e.target.querySelector("[type=submit]"); submitBtn.disabled = true; submitBtn.textContent = "Sending…";
  let sent = false;
  if(LEAD_ENDPOINT){ try{ const res = await FGLead.post(LEAD_ENDPOINT, lead); sent = res.ok; }catch(x){} }
  submitBtn.disabled = false; submitBtn.textContent = "Show my full report";
  state.reportEmailed = sent;
  state.lead = {name:lead.name, email:lead.email, organisation:lead.organisation, phone:lead.phone, marketing_opt_in:lead.marketing_opt_in};
  state.unlocked = true; save(); closeSheet(); renderReport(); window.scrollTo(0,0);
};

/* ---------- Navigation ---------- */
const TABS = ["start","scope","ready","report"];
function go(tab){
  TABS.forEach(t => $("#screen-" + t).classList.toggle("on", t === tab));
  document.querySelectorAll(".nav button").forEach(b => b.dataset.tab === tab ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  ({start:renderStart, scope:renderScope, ready:renderReady, report:renderReport})[tab]();
  if(location.hash.slice(1) !== tab) history.replaceState(null, "", "#" + tab);
  window.scrollTo(0,0);
}
function bindGo(root){ root.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go)); }
function updateBadge(){
  const r = results(), b = $("#badge");
  if(r.qs.length && r.unanswered){ b.textContent = r.unanswered; b.hidden = false; } else b.hidden = true;
}
function renderAll(){ updateBadge(); }
document.querySelectorAll(".nav button").forEach(b => b.onclick = () => go(b.dataset.tab));
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if(TABS.includes(h)) go(h); });

updateBadge();
go(TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "start");
</script>
